<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMEGA STRIKE 終焉突擊 — 縱向捲軸射擊</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;}
  body{
    background:radial-gradient(ellipse at 50% 30%,#0a1030 0%,#03040c 70%);
    color:#dff3ff; overflow:hidden;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  #game{position:relative;width:960px;height:720px;overflow:hidden;border-radius:6px;
    box-shadow:0 0 70px rgba(0,220,255,.28),0 0 140px rgba(255,0,160,.12);
    transform-origin:center center;}
  canvas{display:block;position:absolute;inset:0;}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:20;}
  .mono{font-family:"Consolas","Courier New",monospace;}

  /* ---- 側邊 HUD ---- */
  .panel{position:absolute;top:0;bottom:0;width:180px;padding:14px 12px;font-size:13px;letter-spacing:1px;}
  #panelL{left:0;}
  #panelR{right:0;}
  .lbl{color:#4fd0ff;font-size:11px;letter-spacing:2px;opacity:.85;margin-top:14px;}
  .lbl:first-child{margin-top:0;}
  .val{font-family:"Consolas","Courier New",monospace;font-size:21px;color:#fff;
    text-shadow:0 0 10px rgba(90,220,255,.9);line-height:1.15;}
  .val.sm{font-size:16px;}
  .gold{color:#ffd766;text-shadow:0 0 10px rgba(255,190,60,.9);}
  .pink{color:#ff77c8;text-shadow:0 0 10px rgba(255,80,180,.9);}
  #combo{transition:transform .08s;}
  #combo.pump{transform:scale(1.35);}

  /* 武器條 */
  .wep{margin:3px 0;padding:3px 6px;border-left:3px solid #1d3350;color:#5d7896;font-size:12px;
    display:flex;justify-content:space-between;align-items:center;border-radius:0 4px 4px 0;}
  .wep.on{border-left-color:#00e5ff;color:#eafcff;background:linear-gradient(90deg,rgba(0,200,255,.28),rgba(0,200,255,0));
    text-shadow:0 0 8px rgba(0,220,255,.9);}
  .lv{display:flex;gap:2px;}
  .lv i{width:7px;height:11px;background:#16283e;border-radius:1px;display:block;}
  .wep.on .lv i.f{background:#00e5ff;box-shadow:0 0 6px #00e5ff;}
  .lv i.f{background:#2b6f8a;}

  /* BURST 能量 */
  #burstwrap{position:relative;height:120px;width:100%;border:1px solid #1d4a63;border-radius:4px;
    background:rgba(0,20,35,.6);overflow:hidden;}
  #burstbar{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(0deg,#0066ff,#00e5ff 55%,#c0f8ff);box-shadow:0 0 18px rgba(0,220,255,.8);}
  #burstwrap.full #burstbar{background:linear-gradient(0deg,#ff4d00,#ffd400 55%,#fffbe0);
    animation:bfl .45s infinite alternate;}
  @keyframes bfl{from{filter:brightness(1)}to{filter:brightness(1.7)}}
  #bursttxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;letter-spacing:3px;color:#fff;text-shadow:0 0 8px #000;}
  .lifedot{display:inline-block;width:15px;height:15px;margin-right:5px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#bff6ff,#0099ff 60%,#003a6b);
    box-shadow:0 0 10px rgba(0,190,255,.9);}
  .keys{position:absolute;bottom:12px;left:12px;right:12px;font-size:10.5px;color:#4f7ba0;line-height:1.7;letter-spacing:0;}
  .keys b{color:#8fd8ff;font-weight:normal;}

  /* ---- Boss 血條 ---- */
  #bossbar{position:absolute;left:180px;width:600px;top:8px;display:none;}
  #bossname{font-size:13px;letter-spacing:3px;color:#ff8ec4;text-shadow:0 0 10px rgba(255,40,140,.9);
    display:flex;justify-content:space-between;padding:0 4px 3px;}
  #bosshpwrap{height:11px;background:rgba(10,0,20,.75);border:1px solid #ff4d9d;border-radius:5px;overflow:hidden;position:relative;}
  #bosshp{height:100%;width:100%;background:linear-gradient(90deg,#ff0066,#ff4d9d 50%,#ffd0e6);
    box-shadow:0 0 16px rgba(255,60,150,.9);transition:width .08s linear;}
  #bosshpghost{position:absolute;top:0;bottom:0;left:0;background:rgba(255,255,255,.35);transition:width .5s ease-out .18s;}
  #phasedots{display:flex;gap:4px;margin-top:4px;padding:0 4px;}
  #phasedots i{flex:1;height:3px;background:#3a0d24;border-radius:2px;}
  #phasedots i.on{background:#ff4d9d;box-shadow:0 0 8px #ff4d9d;}

  /* ---- 中央訊息 ---- */
  #center{position:absolute;left:180px;width:600px;top:0;height:720px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #center>*{pointer-events:auto;}
  .big{font-size:46px;letter-spacing:8px;font-weight:bold;
    background:linear-gradient(180deg,#ffffff,#7fe9ff 55%,#0088ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,200,255,.85));}
  .sub{font-size:15px;letter-spacing:6px;color:#9fdcff;margin-top:8px;}
  .warn{font-size:60px;font-weight:bold;letter-spacing:10px;color:#fff;
    text-shadow:0 0 22px #ff0044,0 0 60px #ff0044;animation:wpul .38s infinite alternate;}
  @keyframes wpul{from{transform:scale(.94);opacity:.62}to{transform:scale(1.06);opacity:1}}
  .warnsub{font-size:16px;letter-spacing:8px;color:#ffb0c8;margin-top:10px;}
  .fadein{animation:fi .5s ease-out both;}
  @keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 標題／結算面板 */
  .card{background:linear-gradient(180deg,rgba(4,16,38,.94),rgba(2,8,22,.94));
    border:1px solid #1e6f9b;border-radius:10px;padding:22px 30px;min-width:430px;
    box-shadow:0 0 45px rgba(0,150,255,.35),inset 0 0 40px rgba(0,90,160,.2);}
  .card h2{font-size:20px;letter-spacing:6px;color:#7fe9ff;margin-bottom:14px;font-weight:normal;}
  table.res{width:100%;font-size:15px;}
  table.res td{padding:5px 4px;}
  table.res td:last-child{text-align:right;font-family:"Consolas",monospace;color:#fff;}
  .rank{font-size:96px;font-weight:bold;line-height:1;letter-spacing:4px;
    filter:drop-shadow(0 0 26px currentColor);}
  .menu{margin-top:16px;}
  .mi{padding:6px 16px;font-size:16px;letter-spacing:4px;color:#7fa8c8;cursor:pointer;border-radius:5px;}
  .mi.sel{color:#fff;background:linear-gradient(90deg,rgba(0,200,255,0),rgba(0,200,255,.3),rgba(0,200,255,0));
    text-shadow:0 0 12px #00e5ff;}
  .mi.sel::before{content:"◤ ";color:#00e5ff;}
  .mi.sel::after{content:" ◥";color:#00e5ff;}
  .ships{display:flex;gap:14px;justify-content:center;margin:6px 0 4px;}
  .ship{width:132px;padding:10px 8px;border:1px solid #17435f;border-radius:8px;background:rgba(0,20,40,.6);
    cursor:pointer;transition:.12s;}
  .ship.sel{border-color:#00e5ff;background:rgba(0,80,130,.45);box-shadow:0 0 24px rgba(0,200,255,.5);transform:translateY(-5px);}
  .ship canvas{position:static;margin:0 auto 6px;display:block;}
  .ship .nm{font-size:13px;letter-spacing:2px;color:#cfefff;text-align:center;}
  .ship .de{font-size:10.5px;color:#6f9bbb;text-align:center;margin-top:4px;line-height:1.5;}
  .blink{animation:bk 1s steps(2) infinite;}
  @keyframes bk{50%{opacity:.25}}

  #dmgflash{position:absolute;inset:0;pointer-events:none;z-index:30;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,0,60,.55));opacity:0;}
  #scanlines{position:absolute;inset:0;pointer-events:none;z-index:40;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:39;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,12,.7) 100%);}
  #dbg{position:absolute;left:186px;top:26px;font-size:11px;color:#7dff9b;z-index:45;display:none;
    font-family:"Consolas",monospace;text-shadow:0 0 6px #000;line-height:1.5;}
  #pause{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;
    background:rgba(0,6,18,.72);font-size:34px;letter-spacing:12px;color:#9fe9ff;text-shadow:0 0 20px #0af;}
</style>

<body>
<div id="game">
  <canvas id="cv" width="960" height="720"></canvas>
  <div id="ui">
    <div class="panel" id="panelL">
      <div class="lbl">HI-SCORE</div><div class="val sm gold mono" id="hiscore">0</div>
      <div class="lbl">SCORE</div><div class="val mono" id="score">0</div>
      <div class="lbl">CHAIN COMBO</div><div class="val pink mono" id="combo">×1</div>
      <div class="lbl">GRAZE 擦彈</div><div class="val sm mono" id="graze">0</div>
      <div class="lbl">SHIP 殘機</div><div class="val sm" id="lives"></div>
      <div class="keys">
        <b>方向鍵/WASD</b> 移動<br>
        <b>Z / 空白</b> 射擊（可長按）<br>
        <b>Shift</b> 零時領域＋集中<br>
        <b>X</b> BURST 超必殺<br>
        <b>Q/E 或 1 2 3</b> 切換武器<br>
        <b>P</b> 暫停　<b>M</b> 靜音
      </div>
    </div>
    <div class="panel" id="panelR">
      <div class="lbl">STAGE</div><div class="val sm mono" id="stagelbl">1 / 3</div>
      <div class="lbl">WEAPON 武裝</div>
      <div id="weplist"></div>
      <div class="lbl">OPTION 僚機</div><div class="val sm mono" id="opt">0</div>
      <div class="lbl">BURST 能量</div>
      <div id="burstwrap"><div id="burstbar"></div><div id="bursttxt"></div></div>
      <div class="lbl">ZERO FIELD</div>
      <div class="val sm mono" id="zerolbl" style="font-size:13px;color:#7fa8c8">待機</div>
    </div>
    <div id="bossbar">
      <div id="bossname"><span id="bnl">—</span><span id="bnr" class="mono"></span></div>
      <div id="bosshpwrap"><div id="bosshpghost"></div><div id="bosshp"></div></div>
      <div id="phasedots"></div>
    </div>
    <div id="center"></div>
  </div>
  <div id="dmgflash"></div>
  <div id="pause">PAUSED</div>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="dbg"></div>
</div>
<script>
"use strict";
/* =====================================================================
   OMEGA STRIKE 終焉突擊
   縱向捲軸射擊 — 三關卡 / 三大魔王 / 純程序化繪圖，無外部資產
   ===================================================================== */

/* ---------------- 常數 ---------------- */
const W = 960, H = 720;          // 全畫面
const PFX = 180, PFW = 600, PFH = 720;   // 戰場（playfield）位置與尺寸
const SEC = 60;                  // 1 秒 = 60 幀（本作以「幀」為時間單位）

const CAP_EB = 1300, CAP_PB = 340, CAP_PT = 2200, CAP_EN = 90, CAP_IT = 120;

const cvs = document.getElementById('cv');
const ctx = cvs.getContext('2d', { alpha: false });

/* URL 參數（除錯用） */
const QS = new URLSearchParams(location.search);
const DEBUG = QS.get('debug') === '1';
const AUTO  = QS.get('auto') === '1';           // 自動操作（煙霧測試用）
const QSTAGE = parseInt(QS.get('stage') || '0', 10);
const QBOSS  = parseInt(QS.get('boss')  || '0', 10);
const QDMG   = parseFloat(QS.get('dmg') || '1');   // 除錯：自機火力倍率
const QPHASE = parseInt(QS.get('phase') || '1', 10); // 除錯：Boss 起始階段

/* ---------------- 小工具 ---------------- */
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => (a + Math.random() * (b - a + 1)) | 0;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const approach = (v, t, s) => v < t ? Math.min(v + s, t) : Math.max(v - s, t);
const fmt = n => n.toLocaleString('en-US');

/* 物件池：主迴圈零配置 */
class Pool {
  constructor(factory, cap) { this.f = factory; this.cap = cap; this.a = []; this.free = []; this.rr = 0; }
  get() {
    let o;
    if (this.free.length) o = this.free.pop();
    else if (this.a.length < this.cap) { o = this.f(); this.a.push(o); }
    else { o = this.a[this.rr++ % this.a.length]; }   // 超過上限：回收最舊者
    o.alive = true; return o;
  }
  kill(o) { if (o.alive) { o.alive = false; this.free.push(o); } }
  each(fn) { const a = this.a; for (let i = 0; i < a.length; i++) if (a[i].alive) fn(a[i]); }
  count() { return this.a.length - this.free.length; }
  clear() { const a = this.a; this.free.length = 0; for (let i = 0; i < a.length; i++) { a[i].alive = false; this.free.push(a[i]); } }
}

/* ---------------- 輸入 ----------------
   移動：方向鍵 / WASD　射擊：Z 或空白　BURST：X
   零時領域＋集中：Shift　切換武器：Q / E 或 1 2 3            */
const K = {};                       // 以小寫字母 / 特殊鍵名為 key 的按住狀態
const key = { up:0, down:0, left:0, right:0, shot:0, burst:0, focus:0 };
let anyKeyPressed = false, confirmEdge = false, menuDelta = 0, wepEdge = 0, wepPick = -1;

const norm = k => (k.length === 1 ? k.toLowerCase() : k);

function syncKeys() {
  key.up    = K['arrowup']    || K['w'] ? 1 : 0;
  key.down  = K['arrowdown']  || K['s'] ? 1 : 0;
  key.left  = K['arrowleft']  || K['a'] ? 1 : 0;
  key.right = K['arrowright'] || K['d'] ? 1 : 0;
  key.shot  = K['z'] || K[' '] || K['enter'] ? 1 : 0;
  key.burst = K['x'] ? 1 : 0;
  key.focus = K['shift'] ? 1 : 0;
}
const PREVENT = ['arrowup','arrowdown','arrowleft','arrowright',' ','enter'];
window.addEventListener('keydown', e => {
  const k = norm(e.key).toLowerCase();
  if (PREVENT.includes(k)) e.preventDefault();
  if (e.repeat) return;
  K[k] = true; anyKeyPressed = true; Audio_.unlock();
  if (k === 'q') wepEdge = -1;
  if (k === 'e') wepEdge = 1;
  if (k === '1' || k === '2' || k === '3') wepPick = +k - 1;
  if (k === 'p') togglePause();
  if (k === 'm') Audio_.toggle();
  if (k === 'enter' || k === 'z' || k === ' ') confirmEdge = true;
  if (k === 'arrowup' || k === 'arrowleft' || k === 'w' || k === 'a') menuDelta = -1;
  if (k === 'arrowdown' || k === 'arrowright' || k === 's' || k === 'd') menuDelta = 1;
  syncKeys();
});
window.addEventListener('keyup', e => { K[norm(e.key).toLowerCase()] = false; syncKeys(); });
window.addEventListener('blur', () => { for (const k in K) K[k] = false; syncKeys(); });

/* 滑鼠／觸控：拖曳操作 */
let pointerActive = false, pointerX = 0, pointerY = 0, pointerShot = false;
function pointerPos(ev) {
  const r = cvs.getBoundingClientRect();
  const sx = cvs.width / r.width, sy = cvs.height / r.height;
  const p = ev.touches ? ev.touches[0] : ev;
  pointerX = (p.clientX - r.left) * sx - PFX;
  pointerY = (p.clientY - r.top) * sy;
}
cvs.addEventListener('mousedown', e => { pointerActive = true; pointerShot = true; pointerPos(e); Audio_.unlock(); confirmEdge = true; anyKeyPressed = true; });
window.addEventListener('mousemove', e => { if (pointerActive) pointerPos(e); });
window.addEventListener('mouseup', () => { pointerActive = false; pointerShot = false; });
cvs.addEventListener('touchstart', e => { pointerActive = true; pointerShot = true; pointerPos(e); Audio_.unlock(); confirmEdge = true; anyKeyPressed = true; e.preventDefault(); }, { passive: false });
cvs.addEventListener('touchmove', e => { pointerPos(e); e.preventDefault(); }, { passive: false });
cvs.addEventListener('touchend', e => { pointerActive = false; pointerShot = false; e.preventDefault(); }, { passive: false });

/* 視窗縮放：小螢幕自動等比縮小 */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
  document.getElementById('game').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ---------------- 音效（WebAudio 程序化合成） ---------------- */
const Audio_ = (() => {
  let ac = null, master = null, muted = false, ready = false;
  const last = {};
  function unlock() {
    if (ready) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination);
      ready = true; bgm.init();
    } catch (e) { ready = false; }
  }
  function ok(name, gapMs) {
    if (!ready || muted) return false;
    const t = performance.now();
    if (last[name] && t - last[name] < gapMs) return false;
    last[name] = t; return true;
  }
  function env(node, t0, a, d, peak) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    node.connect(g); g.connect(master); return g;
  }
  let noiseBuf = null;
  function noise() {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ac.createBufferSource(); s.buffer = noiseBuf; return s;
  }
  const A = {
    unlock,
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; },
    get muted() { return muted; },
    shot(w) {
      if (!ok('shot', 45)) return;
      const t = ac.currentTime, o = ac.createOscillator();
      o.type = w === 1 ? 'sawtooth' : 'square';
      o.frequency.setValueAtTime(w === 1 ? 900 : 640, t);
      o.frequency.exponentialRampToValueAtTime(w === 1 ? 260 : 180, t + 0.07);
      env(o, t, 0.004, 0.07, 0.055); o.start(t); o.stop(t + 0.1);
    },
    hit() {
      if (!ok('hit', 32)) return;
      const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 1.6;
      n.connect(f); env(f, t, 0.003, 0.05, 0.05); n.start(t); n.stop(t + 0.07);
    },
    graze() {
      if (!ok('graze', 70)) return;
      const t = ac.currentTime, o = ac.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(2100, t);
      o.frequency.exponentialRampToValueAtTime(3400, t + 0.05);
      env(o, t, 0.003, 0.05, 0.035); o.start(t); o.stop(t + 0.08);
    },
    expl(big) {
      if (!ok('expl' + (big ? 'B' : ''), big ? 60 : 40)) return;
      const t = ac.currentTime, n = noise(), f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.setValueAtTime(big ? 1800 : 1200, t);
      f.frequency.exponentialRampToValueAtTime(90, t + (big ? 0.7 : 0.28));
      n.connect(f); env(f, t, 0.006, big ? 0.75 : 0.3, big ? 0.42 : 0.2);
      n.start(t); n.stop(t + (big ? 0.85 : 0.36));
      if (big) { const o = ac.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(28, t + 0.6);
        env(o, t, 0.01, 0.6, 0.5); o.start(t); o.stop(t + 0.7); }
    },
    burst() {
      if (!ok('burst', 200)) return;
      const t = ac.currentTime;
      for (let i = 0; i < 3; i++) {
        const o = ac.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(120 + i * 60, t);
        o.frequency.exponentialRampToValueAtTime(2600 + i * 400, t + 0.32);
        env(o, t, 0.02, 0.5, 0.14); o.start(t); o.stop(t + 0.6);
      }
      const n = noise(), f = ac.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 700; n.connect(f);
      env(f, t, 0.02, 0.6, 0.25); n.start(t); n.stop(t + 0.7);
    },
    warn() {
      if (!ok('warn', 340)) return;
      const t = ac.currentTime;
      [0, 0.19].forEach((d, i) => {
        const o = ac.createOscillator(); o.type = 'square';
        o.frequency.value = i ? 660 : 880;
        env(o, t + d, 0.01, 0.16, 0.09); o.start(t + d); o.stop(t + d + 0.2);
      });
    },
    power() {
      if (!ok('power', 60)) return;
      const t = ac.currentTime, o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.12);
      env(o, t, 0.005, 0.14, 0.1); o.start(t); o.stop(t + 0.18);
    },
    die() {
      if (!ok('die', 400)) return;
      const t = ac.currentTime, o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.9);
      env(o, t, 0.01, 1.0, 0.28); o.start(t); o.stop(t + 1.1);
    },
    zero(on) {
      if (!ok('zero', 260)) return;
      const t = ac.currentTime, o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(on ? 1400 : 400, t);
      o.frequency.exponentialRampToValueAtTime(on ? 300 : 1400, t + 0.25);
      env(o, t, 0.01, 0.3, 0.09); o.start(t); o.stop(t + 0.35);
    }
  };

  /* --- 極簡程序化 BGM（每關不同音階與節奏） --- */
  const bgm = {
    on: false, timer: 0, step: 0, next: 0, pat: null,
    init() { this.on = false; },
    play(idx) {
      this.pat = BGM_PATTERNS[idx]; this.step = 0;
      if (ready) this.next = ac.currentTime + 0.06;
      this.on = true;
    },
    stop() { this.on = false; },
    tick() {
      if (!this.on || !ready || muted || !this.pat) return;
      const p = this.pat, spb = 60 / p.bpm / 4;      // 16 分音符
      // 音訊在 play() 之後才解鎖時 next 會落後太多，先對齊到現在
      if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;
      while (this.next < ac.currentTime + 0.16) {
        const t = this.next, s = this.step % p.len;
        const bn = p.bass[s % p.bass.length];
        if (bn > 0) {
          const o = ac.createOscillator(); o.type = 'triangle';
          o.frequency.value = bn;
          const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.6);
          o.connect(g); g.connect(master); o.start(t); o.stop(t + spb * 2);
        }
        const ln = p.lead[s % p.lead.length];
        if (ln > 0) {
          const o = ac.createOscillator(); o.type = p.wave;
          o.frequency.value = ln;
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
          const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.05, t + 0.008);
          g.gain.exponentialRampToValueAtTime(0.0001, t + spb * 1.1);
          o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + spb * 1.5);
        }
        if (s % 4 === 0) {  // 底鼓
          const o = ac.createOscillator(); o.type = 'sine';
          o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
          const g = ac.createGain(); g.gain.setValueAtTime(0.22, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
          o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.18);
        }
        this.next += spb; this.step++;
      }
    }
  };
  A.bgm = bgm;
  return A;
})();

/* =====================================================================
   Sprite Factory — 開場預繪輝光圖，主迴圈只做 drawImage（避免 shadowBlur）
   ===================================================================== */
function offc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const glowCache = new Map();
/** 圓形輝光貼圖：中心亮、邊緣透明 */
function glow(color, size) {
  const k = color + '|' + size;
  let g = glowCache.get(k);
  if (g) return g;
  const c = offc(size * 2, size * 2), x = c.getContext('2d');
  const gr = x.createRadialGradient(size, size, 0, size, size, size);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.25, color);
  gr.addColorStop(0.6, color.replace('rgb(', 'rgba(').replace(')', ',.45)'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, size * 2, size * 2);
  glowCache.set(k, c); return c;
}
/** 純光暈（無實心核心），用於爆炸與能量場 */
function soft(color, size) {
  const k = 's' + color + '|' + size;
  let g = glowCache.get(k);
  if (g) return g;
  const c = offc(size * 2, size * 2), x = c.getContext('2d');
  const gr = x.createRadialGradient(size, size, 0, size, size, size);
  gr.addColorStop(0, color.replace('rgb(', 'rgba(').replace(')', ',.95)'));
  gr.addColorStop(0.45, color.replace('rgb(', 'rgba(').replace(')', ',.35)'));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, size * 2, size * 2);
  glowCache.set(k, c); return c;
}
function drawGlow(img, x, y, s) { const h = img.width * s * 0.5; ctx.drawImage(img, x - h, y - h, h * 2, h * 2); }

const PT_SPARK = 0, PT_SMOKE = 1, PT_RING = 2, PT_SHARD = 3, PT_TEXT = 4, PT_BOLT = 5;
const parts = new Pool(() => ({
  alive:false, x:0, y:0, vx:0, vy:0, life:0, max:1, size:1, col:COL.white, t:PT_SPARK,
  rot:0, vr:0, txt:'', grow:0, drag:0.94, gy:0
}), CAP_PT);

function spark(x, y, n, col, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const p = parts.get(), a = rnd(0, TAU), s = rnd(spd * .25, spd);
    p.t = PT_SPARK; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.life = p.max = life * rnd(.6, 1.2); p.col = col; p.size = size * rnd(.6, 1.25);
    p.drag = .93; p.gy = 0;
  }
}
function smoke(x, y, n, col, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const p = parts.get(), a = rnd(0, TAU), s = rnd(0, spd);
    p.t = PT_SMOKE; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - .3;
    p.life = p.max = life * rnd(.7, 1.3); p.col = col; p.size = size * rnd(.7, 1.4);
    p.grow = rnd(.25, .7); p.drag = .95; p.gy = 0;
  }
}
function ringFx(x, y, col, size, life, grow) {
  const p = parts.get();
  p.t = PT_RING; p.x = x; p.y = y; p.vx = p.vy = 0; p.col = col;
  p.size = size; p.life = p.max = life; p.grow = grow; p.drag = 1;
}
function shard(x, y, n, col, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const p = parts.get(), a = rnd(0, TAU), s = rnd(spd * .3, spd);
    p.t = PT_SHARD; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
    p.life = p.max = life * rnd(.7, 1.3); p.col = col; p.size = size * rnd(.6, 1.3);
    p.rot = rnd(0, TAU); p.vr = rnd(-.3, .3); p.drag = .97; p.gy = .06;
  }
}
function bolt(x, y, col, size, life) {
  const p = parts.get();
  p.t = PT_BOLT; p.x = x; p.y = y; p.col = col; p.size = size; p.life = p.max = life;
  p.rot = rnd(0, TAU); p.vx = p.vy = 0; p.drag = 1;
}
function popText(x, y, txt, col, size) {
  const p = parts.get();
  p.t = PT_TEXT; p.x = x; p.y = y; p.vx = rnd(-.4, .4); p.vy = -1.4;
  p.life = p.max = 44; p.col = col; p.txt = txt; p.size = size || 15; p.drag = .94;
}
/** 爆炸：閃光 + 衝擊環 + 火花 + 煙 */
function explode(x, y, scale, col1, col2) {
  col1 = col1 || COL.orange; col2 = col2 || COL.yellow;
  const busy = parts.count() > 900;          // 場面過載時自動減量，維持幀率
  ringFx(x, y, col2, 8 * scale, 22, 2.6 * scale);
  if (!busy) ringFx(x, y, col1, 4 * scale, 32, 1.5 * scale);
  spark(x, y, ((busy ? 4 : 8) * scale) | 0, col2, 3.4 * scale, 3 * scale, 26);
  if (!busy) smoke(x, y, (3 * scale) | 0, 'rgb(90,70,80)', 1.4 * scale, 7 * scale, 40);
  shard(x, y, ((busy ? 2 : 3) * scale) | 0, col1, 2.6 * scale, 4 * scale, 42);
  addShake(scale * 2.2);
  Audio_.expl(scale > 2.4);
}

function updateParts(dt) {
  parts.each(p => {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt); p.vy += p.gy * dt;
    if (p.t === PT_RING || p.t === PT_SMOKE) p.size += p.grow * dt;
    if (p.t === PT_SHARD) p.rot += p.vr * dt;
    p.life -= dt;
    if (p.life <= 0) parts.kill(p);
  });
}
function drawParts() {
  ctx.globalCompositeOperation = 'lighter';
  parts.each(p => {
    const k = p.life / p.max;
    switch (p.t) {
      case PT_SPARK: {
        ctx.globalAlpha = clamp(k, 0, 1);
        drawGlow(glow(p.col, 16), p.x, p.y, p.size * .16 * (0.4 + k * .8));
        break; }
      case PT_SMOKE: {
        ctx.globalAlpha = clamp(k, 0, 1) * .30;
        drawGlow(soft(p.col, 24), p.x, p.y, p.size * .11);
        break; }
      case PT_RING: {
        ctx.globalAlpha = clamp(k, 0, 1) * .9;
        ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(1, 5 * k);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.stroke();
        break; }
      case PT_SHARD: {
        ctx.globalAlpha = clamp(k, 0, 1);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.moveTo(-p.size, -p.size * .35); ctx.lineTo(p.size, 0);
        ctx.lineTo(-p.size * .6, p.size * .5); ctx.closePath(); ctx.fill();
        ctx.restore();
        break; }
      case PT_BOLT: {
        ctx.globalAlpha = clamp(k, 0, 1);
        ctx.strokeStyle = p.col; ctx.lineWidth = 2;
        ctx.beginPath();
        let bx = p.x, by = p.y, a = p.rot;
        ctx.moveTo(bx, by);
        for (let i = 0; i < 5; i++) {
          a += rnd(-.7, .7); bx += Math.cos(a) * p.size * .25; by += Math.sin(a) * p.size * .25;
          ctx.lineTo(bx, by);
        }
        ctx.stroke();
        break; }
      case PT_TEXT: {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = clamp(k * 1.6, 0, 1);
        ctx.font = 'bold ' + p.size + 'px Consolas,monospace';
        ctx.textAlign = 'center'; ctx.fillStyle = p.col;
        ctx.fillText(p.txt, p.x, p.y);
        ctx.globalCompositeOperation = 'lighter';
        break; }
    }
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function eb(x, y, ang, sp, col, r, type) {

function ring(x, y, n, sp, a0, col, r, type) {

}
function fan(x, y, n, spread, aim, sp, col, r, type) {
  if (n === 1) { eb(x, y, aim, sp, col, r, type); return; }
  for (let i = 0; i < n; i++) eb(x, y, aim - spread / 2 + spread * i / (n - 1), sp, col, r, type);
}
function fanSpd(x, y, n, aim, sp0, sp1, col, r, type) {

/* 雷射（含預警） */
const lasers = [];
function laser(o) {
  lasers.push(Object.assign({
    x:0, y:0, ang:Math.PI/2, w:26, len:1200, warn:50, fire:70, t:0, col:COL.mag,
    follow:null, spin:0, aimOnce:false, dead:false, hitAt:0
  }, o));
}
function updateLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const L = lasers[i];
    L.t += dt;
    if (L.follow) {
      // 發射源已死亡（或物件池回收）→ 解除跟隨，雷射停在原地打完
      if (L.follow.alive === false || L.follow.dead === true) L.follow = null;
      else { L.x = L.follow.x + (L.ox || 0); L.y = L.follow.y + (L.oy || 0); }
    }
    if (L.aimOnce && L.t < L.warn) L.ang = aimP(L.x, L.y);
    L.ang += L.spin * dt;
    if (L.t > L.warn + L.fire) lasers.splice(i, 1);
  }
}
function drawLasers() {
  ctx.globalCompositeOperation = 'lighter';
  for (const L of lasers) {
    const firing = L.t >= L.warn;
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(L.ang);
    if (!firing) {
      const k = L.t / L.warn;
      ctx.globalAlpha = .30 + .35 * Math.abs(Math.sin(L.t * .35));
      ctx.fillStyle = L.col; ctx.fillRect(0, -1.4, L.len, 2.8);
      ctx.globalAlpha = .16 * k; ctx.fillRect(0, -L.w * .5 * k, L.len, L.w * k);
    } else {
      const ft = (L.t - L.warn) / L.fire;
      const grow = ft < .12 ? ft / .12 : (ft > .82 ? (1 - ft) / .18 : 1);
      const w = L.w * grow;
      ctx.globalAlpha = .32;
      ctx.fillStyle = L.col; ctx.fillRect(0, -w, L.len, w * 2);
      ctx.globalAlpha = .85; ctx.fillRect(0, -w * .5, L.len, w);
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.fillRect(0, -w * .19, L.len, w * .38);
      ctx.restore(); ctx.save();
      ctx.globalAlpha = .8;
      drawGlow(soft(L.col, 32), L.x, L.y, w * .09);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
/** 點到雷射的距離判定 */
function laserHit(L, px, py, pad) {
  if (L.t < L.warn) return false;
  const ft = (L.t - L.warn) / L.fire;
  const grow = ft < .12 ? ft / .12 : (ft > .82 ? (1 - ft) / .18 : 1);
  const dx = px - L.x, dy = py - L.y;
  const c = Math.cos(-L.ang), s = Math.sin(-L.ang);
  const lx = dx * c - dy * s, ly = dx * s + dy * c;
  return lx > -4 && lx < L.len && Math.abs(ly) < L.w * .5 * grow + pad;
}

  inv: 0, dead: 0, shotT: 0, missT: 0, focus: 0, focusK: 0, zero: 0,
  trail: [], hitR: 3.4, grazeR: 24, swap: 0, alive: true, respawn: 0, autoAim: 0
};

function resetPlayer(full) {
  player.x = PFW / 2; player.y = PFH - 130;
  player.inv = 150; player.dead = 0; player.alive = true;
  player.trail.length = 0;
  if (full) {
    const s = SHIPS[player.ship];
    player.spd = s.spd; player.fspd = s.fspd; player.dmgMul = s.dmg * QDMG; player.burstGain = s.burst;
    player.weapon = 0; player.lv = [1, 1, 1]; player.options = 0;
    player.lives = 3; player.burst = 30;
  }
}

const inBattle = () => game.state === 'PLAY' || game.state === 'BOSS';
function playerDamage() {
  if (player.inv > 0 || !player.alive || !inBattle()) return;
  player.alive = false; player.dead = 90; game.deaths++;
  explode(player.x, player.y, 3.2, 'rgb(120,200,255)', 'rgb(255,255,255)');
  ringFx(player.x, player.y, 'rgb(150,220,255)', 10, 40, 4);
  Audio_.die();
  flashScreen(.9, 'rgb(255,60,90)');
  addShake(14);
  // 死亡懲罰：武器降一級、失去一台僚機
  player.lv[player.weapon] = Math.max(1, player.lv[player.weapon] - 1);
  if (player.options > 0) { player.options--; item(player.x, player.y - 20, IT_OPTION); }
  player.burst = Math.max(player.burst, 40);
  breakCombo();
  // 附近敵彈化為分數寶石，避免復活即死
  ebs.each(b => { if (dist2(b.x, b.y, player.x, player.y) < 190 * 190) { ebs.kill(b); item(b.x, b.y, IT_GEM, -.8); } });
}

function pickUp(it) {
  switch (it.t) {
    case IT_POWER: {
      const w = player.weapon;
      if (player.lv[w] < 5) { player.lv[w]++; popText(it.x, it.y, 'POWER UP ' + player.lv[w], '#7fffd0', 15); Audio_.power(); }
      else { addScore(2000); popText(it.x, it.y, 'MAX +2000', '#ffd766', 14); }
      break; }
    case IT_OPTION:
      if (player.options < 4) { player.options++; popText(it.x, it.y, 'OPTION +1', '#9ecbff', 15); Audio_.power(); }
      else { addScore(4000); popText(it.x, it.y, '+4000', '#ffd766', 14); }
      break;
    case IT_BURST:
      player.burst = Math.min(player.burstMax, player.burst + 34);
      popText(it.x, it.y, 'BURST +', '#ffd766', 15); Audio_.power(); break;
    case IT_1UP:
      player.lives++; popText(it.x, it.y, '1UP!', '#ff9ee0', 20); Audio_.power(); break;
    case IT_GEM:
      addScore(400); break;
  }
  items.kill(it);
}

function updateItems(dt) {
  items.each(it => {
    // 自機在畫面上方 1/4 或距離接近 → 磁吸
    const d2 = dist2(it.x, it.y, player.x, player.y);
    if (player.alive && (d2 < 120 * 120 || player.y < 190)) it.mag = 1;
    if (it.mag && player.alive) {
      const a = angTo(it.x, it.y, player.x, player.y);
      it.vx = approach(it.vx, Math.cos(a) * 9, .55 * dt);
      it.vy = approach(it.vy, Math.sin(a) * 9, .55 * dt);
    } else {
      it.vy = approach(it.vy, 1.5, .045 * dt); it.vx *= Math.pow(.99, dt);
    }
    it.x += it.vx * dt; it.y += it.vy * dt; it.rot += .06 * dt;
    it.life -= dt;
    if (it.life <= 0 || it.y > PFH + 40) { items.kill(it); return; }
    if (player.alive && d2 < 24 * 24) pickUp(it);
  });
}

const ITEM_STYLE = [
  { c1:'#00ffb0', c2:'#006644', tx:'P', glow:'rgb(0,255,176)' },
  { c1:'#7fd0ff', c2:'#0a3f7a', tx:'O', glow:'rgb(127,208,255)' },
  { c1:'#ffd766', c2:'#7a4a00', tx:'B', glow:'rgb(255,215,102)' },

  { c1:'#fff2a8', c2:'#8a6a00', tx:'',  glow:'rgb(255,242,168)' }
];
function drawItems() {
  items.each(it => {
    const st = ITEM_STYLE[it.t], blink = it.life < 120 && ((it.life / 6) | 0) % 2 === 0;
    if (blink) return;

      ctx.globalCompositeOperation = 'lighter';
      drawGlow(glow('rgb(255,235,140)', 16), it.x, it.y, .5);

      ctx.restore(); return;
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .55 + Math.sin(it.rot * 3) * .15;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    const w = 9 + Math.sin(it.rot * 2) * 1.5;
    ctx.fillStyle = st.c2; ctx.strokeStyle = st.c1; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(-w, -10, w * 2, 20); ctx.fill(); ctx.stroke();
    ctx.fillStyle = st.c1; ctx.font = 'bold 13px Consolas,monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(st.tx, 0, 1);
    ctx.restore(); ctx.textBaseline = 'alphabetic';
  });
}

/* ---- 射擊 ---- */
function fireWeapon() {
  const w = player.weapon, L = player.lv[w], dm = player.dmgMul, F = player.focus;
  const px = player.x, py = player.y - 16;
  if (w === 0) {           /* VULCAN：散射，等級越高彈數越多、角度越廣 */
    if (player.shotT > 0) return;
    player.shotT = 6;
    const n = 1 + L;                       // 2..6 發
    const spread = (F ? .10 : .22) * (n - 1);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (n === 1 ? 0 : -spread / 2 + spread * i / (n - 1));
      pb(px + Math.cos(a) * 10, py, Math.cos(a) * 15, Math.sin(a) * 15, 5.2 * dm, PB_PELLET, 5, 0);
    }
    Audio_.shot(0);
  } else if (w === 1) {    /* LANCER：貫穿雷射，等級提升寬度與側束 */
    if (player.shotT > 0) return;
    player.shotT = 4;
    const beams = L >= 4 ? 3 : (L >= 2 ? 2 : 1);
    const gap = F ? 5 : 11;
    for (let i = 0; i < beams; i++) {
      const off = (i - (beams - 1) / 2) * gap * 2;
      pb(px + off, py, 0, -21, (4.2 + L * .5) * dm, PB_BEAM, 4 + L * .5, 6);
    }
    if (L === 5) { pb(px - 26, py, -1.4, -19, 3.4 * dm, PB_BEAM, 4, 4); pb(px + 26, py, 1.4, -19, 3.4 * dm, PB_BEAM, 4, 4); }
    Audio_.shot(1);
  } else {                 /* SEEKER：追蹤飛彈齊射 */
    if (player.missT > 0) return;
    player.missT = 19;
    const n = 1 + L;                        // 2..6 發
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1, tier = (i / 2) | 0;
      const b = pb(px + side * (12 + tier * 6), py + tier * 4, side * rnd(2.2, 3.4), -6, 20 * dm, PB_MISSILE, 6, 0);
      b.life = 150;
    }
    Audio_.shot(2);
  }
}
function fireOptions() {
  if (player.options <= 0) return;
  const w = player.weapon, dm = player.dmgMul;
  for (let i = 0; i < player.options; i++) {
    const o = optionPos(i);
    if (w === 0) { if (player.shotT === 6) pb(o.x, o.y - 8, 0, -15, 4.2 * dm, PB_PELLET, 4, 0); }
    else if (w === 1) { if (player.shotT === 4) pb(o.x, o.y - 8, 0, -20, 3.0 * dm, PB_BEAM, 3.4, 4); }
    else { if (player.missT === 19 && i % 2 === 0) {
      const b = pb(o.x, o.y, rnd(-2, 2), -6, 16 * dm, PB_MISSILE, 5, 0); b.life = 150; } }
  }
}
/** 僚機位置：常態跟隨軌跡，集中模式收束到兩側 */
function optionPos(i) {
  const t = player.trail, F = player.focusK;
  const idx = Math.min(t.length - 1, (i + 1) * 9);
  const tr = t.length ? t[idx] : { x: player.x, y: player.y };
  const side = i % 2 ? 1 : -1, tier = (i / 2) | 0;
  const fx = player.x + side * (22 + tier * 15), fy = player.y + 6 + tier * 16;
  return { x: lerp(tr.x, fx, F), y: lerp(tr.y, fy, F) };
}

/* ---- BURST 超必殺 ---- */
function doBurst() {
  if (player.burst < player.burstMax || !player.alive) return;
  player.burst = 0;
  game.burstFx = 46; player.inv = Math.max(player.inv, 70);
  Audio_.burst(); addShake(16); flashScreen(.85, 'rgb(180,240,255)');
  game.slow = Math.max(game.slow, 26);
  ringFx(player.x, player.y, 'rgb(180,250,255)', 20, 46, 22);
  ringFx(player.x, player.y, 'rgb(120,180,255)', 8, 52, 17);
  // 敵彈 → 分數寶石
  let n = 0;
  ebs.each(b => { ebs.kill(b); if ((n++ % 3) === 0) item(b.x, b.y, IT_GEM, -1.2); spark(b.x, b.y, 2, 'rgb(180,240,255)', 2, 3, 18); });
  lasers.length = 0;
  // 全體敵人重擊
  enemies.each(e => damageEnemy(e, 280 * player.dmgMul, player.x, player.y - 40, true));
  if (boss) damageBoss(null, 900 * player.dmgMul, true);
  popText(player.x, player.y - 60, 'BURST!!', '#bff4ff', 26);
}

function updatePlayer(dt) {
  const p = player;
  if (p.shotT > 0) p.shotT -= dt;
  if (p.missT > 0) p.missT -= dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.swap > 0) p.swap -= dt;

  if (!p.alive) {
    p.dead -= dt;
    if (p.dead <= 0) {
      if (p.lives > 0) { p.lives--; resetPlayer(false); }
      else if (inBattle()) gameOver();
    }
    return;
  }

  /* --- 武器切換 --- */
  if (wepEdge) { p.weapon = (p.weapon + wepEdge + 3) % 3; swapFx(); wepEdge = 0; }
  if (wepPick >= 0) { if (wepPick !== p.weapon) { p.weapon = wepPick; swapFx(); } wepPick = -1; }

  /* --- 零時領域（子彈時間） --- */
  const wantZero = key.focus && p.burst >= 25;
  if (wantZero && !p.zero) Audio_.zero(true);
  if (!wantZero && p.zero) Audio_.zero(false);
  p.zero = wantZero ? 1 : 0;
  if (p.zero) { p.burst = Math.max(0, p.burst - 0.30 * dt); }

  p.focus = key.focus ? 1 : 0;
  p.focusK = approach(p.focusK, p.focus, .12 * dt);

  /* --- 移動 --- */
  let dx = 0, dy = 0;
  if (AUTO) { const a = autoPilot(); dx = a.x; dy = a.y; }
  else {
    dx = (key.right ? 1 : 0) - (key.left ? 1 : 0);
    dy = (key.down ? 1 : 0) - (key.up ? 1 : 0);
  }
  const sp = p.focus ? p.fspd : p.spd;
  if (dx || dy) { const m = Math.hypot(dx, dy); dx /= m; dy /= m; }
  if (pointerActive && !AUTO) {
    p.x = approach(p.x, pointerX, sp * 2.4 * dt);
    p.y = approach(p.y, pointerY, sp * 2.4 * dt);
  } else {
    p.x += dx * sp * dt; p.y += dy * sp * dt;
  }
  p.x = clamp(p.x, 14, PFW - 14); p.y = clamp(p.y, 20, PFH - 18);

  /* --- 軌跡（僚機用） --- */
  p.trail.unshift({ x: p.x, y: p.y });
  if (p.trail.length > 60) p.trail.pop();

  /* --- 射擊 --- */
  if (key.shot || pointerShot || AUTO) { fireWeapon(); fireOptions(); }
  if ((key.burst || (AUTO && p.burst >= p.burstMax)) && p.swap <= 0) doBurst();

  /* --- 引擎火焰粒子 --- */
  if (Math.random() < .8) {
    const q = parts.get();
    q.t = PT_SMOKE; q.x = p.x + rnd(-3, 3); q.y = p.y + 15; q.vx = rnd(-.3, .3); q.vy = rnd(1.4, 2.8);
    q.life = q.max = 13; q.col = SHIPS[p.ship].col.replace('#', 'rgb(') ; q.size = 5; q.grow = .3; q.drag = .95; q.gy = 0;
    q.col = 'rgb(120,200,255)';
  }
}

/** 切換武裝的相位變形演出 */
function swapFx() {
  const p = player, c = WEAPONS[p.weapon].col;
  p.swap = 20; Audio_.power();
  ringFx(p.x, p.y, c, 6, 22, 2.2);
  spark(p.x, p.y, 8, c, 2.6, 3, 18);
  popText(p.x, p.y - 34, WEAPONS[p.weapon].short, c, 14);
}

/* 自動操作（?auto=1，煙霧測試用的簡易迴避 AI） */
function autoPilot() {
  const p = player; let fx = 0, fy = 0;
  ebs.each(b => {
    const d2 = dist2(b.x, b.y, p.x, p.y);
    if (d2 < 130 * 130 && d2 > 1) {
      const d = Math.sqrt(d2), w = (130 - d) / 130;
      fx += (p.x - b.x) / d * w * 2.4; fy += (p.y - b.y) / d * w * 2.4;
    }
  });
  fx += (PFW / 2 - p.x) * 0.004;
  fy += ((PFH - 150) - p.y) * 0.01;
  const m = Math.hypot(fx, fy);
  return m > 0.01 ? { x: clamp(fx / m, -1, 1), y: clamp(fy / m, -1, 1) } : { x: 0, y: 0 };
}

/* ---- 自機繪製 ---- */
function drawShipShape(g, ship, scale, tick) {
  const S = SHIPS[ship];
  g.save(); g.scale(scale, scale);
  // 引擎焰
  const fl = 12 + Math.sin(tick * .5) * 4;
  g.globalCompositeOperation = 'lighter';
  const fg = g.createLinearGradient(0, 10, 0, 10 + fl);
  fg.addColorStop(0, 'rgba(180,240,255,.95)'); fg.addColorStop(.5, 'rgba(60,170,255,.55)'); fg.addColorStop(1, 'rgba(0,80,255,0)');
  g.fillStyle = fg;
  g.beginPath(); g.moveTo(-5, 10); g.lineTo(5, 10); g.lineTo(0, 10 + fl); g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-over';

  const body = g.createLinearGradient(0, -20, 0, 18);
  body.addColorStop(0, '#f2fbff'); body.addColorStop(.4, S.col); body.addColorStop(1, S.col2);
  g.fillStyle = body; g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 1.2;

  if (ship === 0) {          // 疾風：細長箭形
    g.beginPath();
    g.moveTo(0, -22); g.lineTo(5, -6); g.lineTo(19, 6); g.lineTo(8, 4);
    g.lineTo(6, 12); g.lineTo(0, 9); g.lineTo(-6, 12); g.lineTo(-8, 4);
    g.lineTo(-19, 6); g.lineTo(-5, -6); g.closePath(); g.fill(); g.stroke();
  } else if (ship === 1) {   // 破壞者：厚重梯形
    g.beginPath();
    g.moveTo(0, -19); g.lineTo(8, -8); g.lineTo(22, 2); g.lineTo(20, 12);
    g.lineTo(8, 9); g.lineTo(5, 14); g.lineTo(-5, 14); g.lineTo(-8, 9);
    g.lineTo(-20, 12); g.lineTo(-22, 2); g.lineTo(-8, -8); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.fillRect(-17, -2, 5, 10); g.fillRect(12, -2, 5, 10);
  } else {                   // 均衡：對稱三角翼
    g.beginPath();
    g.moveTo(0, -21); g.lineTo(6, -4); g.lineTo(20, 8); g.lineTo(9, 7);
    g.lineTo(4, 13); g.lineTo(-4, 13); g.lineTo(-9, 7); g.lineTo(-20, 8);
    g.lineTo(-6, -4); g.closePath(); g.fill(); g.stroke();
  }
  // 座艙
  g.fillStyle = 'rgba(255,255,255,.92)';
  g.beginPath(); g.ellipse(0, -6, 3.2, 6, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(0,220,255,.65)';
  g.beginPath(); g.ellipse(0, -6, 1.8, 4, 0, 0, TAU); g.fill();
  g.restore();
}

function drawPlayer() {
  const p = player;
  if (!p.alive) return;
  const blink = p.inv > 0 && ((p.inv / 4) | 0) % 2 === 0;
  // 零時領域環
  if (p.zero) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .5;
    drawGlow(soft('rgb(90,170,255)', 40), p.x, p.y, 1.6 + Math.sin(game.tick * .2) * .12);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.save(); ctx.translate(p.x, p.y);
  if (!blink) drawShipShape(ctx, p.ship, 1, game.tick);
  ctx.restore();

  // 僚機
  for (let i = 0; i < p.options; i++) {
    const o = optionPos(i);
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(game.tick * .05 + i);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(glow('rgb(120,200,255)', 16), 0, 0, .55);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#cfefff'; ctx.strokeStyle = '#0af'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 3; k++) { const a = k * TAU / 3; ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // 判定點（集中模式時顯示）
  if (p.focusK > .05) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = p.focusK;
    drawGlow(glow('rgb(255,80,140)', 14), p.x, p.y, .42);
    ctx.strokeStyle = 'rgba(255,255,255,' + (.5 * p.focusK) + ')'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.grazeR, 0, TAU); ctx.stroke();
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(game.tick * .04);
    ctx.strokeStyle = 'rgba(120,220,255,' + (.75 * p.focusK) + ')'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(0, 0, p.grazeR + 5, i * TAU / 4, i * TAU / 4 + .5); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}
/* =====================================================================
   敵機
   ===================================================================== */
const enemies = new Pool(() => ({
  alive:false, x:0, y:0, vx:0, vy:0, t:0, hp:1, maxhp:1, r:14, type:'scout',
  flash:0, fireT:0, ang:0, phase:0, a:0, b:0, c:0, side:1, tier:0, score:100, noLoot:false
}), CAP_EN);

/** 敵機定義：hp / 半徑 / 分數 / 掉寶等級 / 行為 / 繪製 */
const ET = {
  /* --- 小型截擊機：斜線俯衝，經過時朝自機打一發 --- */
  scout: { hp:16, r:13, score:120, tier:0,
    beh(e, dt) {
      e.y += e.vy * dt; e.x += e.vx * dt;
      e.vx += Math.cos(e.t * .04) * .06 * e.side * dt;
      if ((e.fireT -= dt) <= 0 && e.y > 40 && e.y < PFH - 160) {
        e.fireT = 999; eb(e.x, e.y + 10, aimP(e.x, e.y), 3.4 + game.rank * .35, COL.mag, 6, EB_RICE);
      }
    },
    draw(e) {
      ctx.rotate(Math.atan2(e.vy, e.vx) - Math.PI / 2 + Math.PI);
      ctx.fillStyle = '#5a2450'; ctx.strokeStyle = '#ff5ca8'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(9, 4); ctx.lineTo(4, 2); ctx.lineTo(0, 11);
      ctx.lineTo(-4, 2); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd0ea'; ctx.beginPath(); ctx.ellipse(0, -3, 2.4, 4, 0, 0, TAU); ctx.fill();
    } },

  /* --- 波形機：橫向擺盪並灑三方向彈 --- */
  waver: { hp:34, r:16, score:220, tier:0,
    beh(e, dt) {
      e.y += e.vy * dt;
      e.x = e.a + Math.sin(e.t * .035 + e.b) * e.c;
      if ((e.fireT -= dt) <= 0 && e.y > 30) {
        e.fireT = 74 - game.rank * 6;
        fan(e.x, e.y + 12, 3, .5, aimP(e.x, e.y), 3.0 + game.rank * .3, COL.purple, 7, EB_ORB);
      }
    },
    draw(e) {
      ctx.rotate(e.t * .05);
      ctx.strokeStyle = '#c07cff'; ctx.lineWidth = 2; ctx.fillStyle = '#33184f';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6; ctx.lineTo(Math.cos(a) * 15, Math.sin(a) * 15); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(glow('rgb(190,110,255)', 16), 0, 0, .6 + Math.sin(e.t * .12) * .1);
      ctx.globalCompositeOperation = 'source-over';

function spawn(type, x, y, opt) {
  const D = ET[type], e = enemies.get();
  e.type = type; e.x = x; e.y = y; e.t = 0; e.flash = 0; e.phase = 0; e.ang = Math.PI / 2;
  e.hp = e.maxhp = Math.round(D.hp * (1 + game.rank * .12) * (1 + game.stage * .18));
  e.r = D.r; e.score = D.score; e.tier = D.tier; e.noLoot = false;
  e.vx = 0; e.vy = 2; e.a = 0; e.b = 0; e.c = 0; e.side = 1; e.fireT = 30;
  if (opt) Object.assign(e, opt);
  return e;
}

function damageEnemy(e, dmg, sx, sy, noFx) {
  const D = ET[e.type];
  // 護盾機：由正面（上方）打來的傷害大幅衰減
  if (D.shieldFront && sy !== undefined && sy < e.y - 4) dmg *= .2;
  e.hp -= dmg; e.flash = 6;
  if (!noFx && Math.random() < .5) spark(sx, sy, 1, 'rgb(255,240,180)', 2.2, 3, 12);
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const D = ET[e.type];
  const sc = Math.round(e.score * game.combo);
  addScore(sc);
  if (e.tier >= 1) popText(e.x, e.y, fmt(sc), '#ffe9a8', e.tier >= 2 ? 22 : 15);
  bumpCombo();
  explode(e.x, e.y, e.tier >= 2 ? 4.2 : (e.tier === 1 ? 2.2 : 1.3),
    e.tier >= 2 ? 'rgb(255,120,40)' : 'rgb(255,150,60)', 'rgb(255,240,160)');
  if (e.tier >= 2) { game.slow = Math.max(game.slow, 22); flashScreen(.4, 'rgb(255,200,120)'); }
  if (D.onDeath) D.onDeath(e);
  if (!e.noLoot) dropLoot(e.x, e.y, e.tier);
  game.kills++;
  enemies.kill(e);
}

function updateEnemies(dt) {
  enemies.each(e => {
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    ET[e.type].beh(e, dt);
    const m = e.r + 90;
    if (e.y > PFH + m || e.y < -m * 2.6 || e.x < -m || e.x > PFW + m) enemies.kill(e);
    // 接觸判定
    if (player.alive && player.inv <= 0 && dist2(e.x, e.y, player.x, player.y) < (e.r * .72 + player.hitR) ** 2) {
      playerDamage();
      if (e.type === 'drone') killEnemy(e);
    }
  });
}

function drawEnemies() {
  enemies.each(e => {
    ctx.save(); ctx.translate(e.x, e.y);
    ET[e.type].draw(e);
    ctx.restore();
    if (e.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp(e.flash / 6, 0, 1) * .75;
      drawGlow(soft('rgb(255,255,255)', 32), e.x, e.y, e.r * .062);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // 中型以上顯示血條
    if (e.tier >= 1 && e.hp < e.maxhp) {
      const w = e.r * 2;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w, 4);
      ctx.fillStyle = e.tier >= 2 ? '#ff5c9d' : '#7fe9ff';
      ctx.fillRect(e.x - w / 2, e.y - e.r - 11, w * clamp(e.hp / e.maxhp, 0, 1), 4);
    }
  });
}
/* =====================================================================
   大魔王框架
   boss = { def, x, y, phase, hp, parts[], ... }
   每個階段以宣告式時間軸（script）描述招式，部位破壞會移除對應攻擊。
   ===================================================================== */
let boss = null;

function makePart(o) {
  return Object.assign({
    name:'', ox:0, oy:0, x:0, y:0, r:26, hp:400, maxhp:400, dead:false, hittable:true,
    orbit:false, ang:0, dist:0, flash:0, vis:true, draw:null, onDead:null, hidden:false
  }, o);
}
function partPos(b, p) {
  if (p.orbit) { p.x = b.x + Math.cos(p.ang) * p.dist; p.y = b.y + Math.sin(p.ang) * p.dist; }
  else { p.x = b.x + p.ox; p.y = b.y + p.oy; }
}
const aliveParts = b => b.parts.filter(p => !p.dead);
const partAlive = (b, name) => b.parts.some(p => p.name === name && !p.dead);

function startBoss(defIdx) {
  const def = BOSSES[defIdx];
  boss = {
    def, x: PFW / 2, y: -160, t: 0, phase: -1, pt: 0, si: 0, hp: 1, maxhp: 1,
    parts: [], enter: 110, dying: 0, dead: false, a: 0, b: 0, c: 0, shakeT: 0,
    hpGhost: 1, timer: 0, flash: 0
  };
  def.init(boss);
  game.state = 'BOSS';
  showBossBar(def);
  nextPhase();
  for (let i = 1; i < QPHASE && boss; i++) nextPhase();
}
function nextPhase() {
  const b = boss;
  b.phase++;
  if (b.phase >= b.def.phases.length) { bossDefeated(); return; }
  const ph = b.def.phases[b.phase];
  b.hp = b.maxhp = Math.round(ph.hp * (1 + game.rank * .10));
  b.pt = 0; b.si = 0; b.hpGhost = 1;
  lasers.length = 0;
  if (b.phase > 0) {
    // 階段轉換演出
    game.slow = Math.max(game.slow, 30); flashScreen(.7, 'rgb(255,220,160)');
    addShake(12); Audio_.expl(true);
    ebs.each(x => { ebs.kill(x); item(x.x, x.y, IT_GEM, -1); });
    for (let i = 0; i < 10; i++) {
      const a = rnd(0, TAU), d = rnd(20, 90);
      explode(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, 2.2);
    }
    popText(b.x, b.y - 70, ph.name, '#ffd27f', 22);
  }
  if (ph.enter) ph.enter(b);
  updateBossBar();
}
function damageBoss(part, dmg, noFx) {
  const b = boss;
  if (!b || b.dying || b.enter > 0) return;
  const ph = b.def.phases[b.phase];
  if (part) {
    part.hp -= dmg; part.flash = 6;
    if (part.hp <= 0) {
      part.dead = true;
      explode(part.x, part.y, 2.6, 'rgb(255,140,60)', 'rgb(255,240,180)');
      addScore(Math.round(3000 * game.combo)); popText(part.x, part.y, 'PART DOWN', '#ffd27f', 17);
      game.slow = Math.max(game.slow, 14);
      if (part.onDead) part.onDead(b, part);
      dropLoot(part.x, part.y, 3);
    }
    return;
  }
  const mul = ph.coreDmgMul ? ph.coreDmgMul(b) : 1;
  b.hp -= dmg * mul;
  b.flash = 4;
  if (b.hp <= 0) { b.hp = 0; nextPhase(); }
}
function bossDefeated() {
  const b = boss;
  b.dying = 220; b.dead = true;
  game.slow = Math.max(game.slow, 90);
  Audio_.bgm.stop();
  ebs.clear(); lasers.length = 0;
  addScore(Math.round(b.def.score * (1 + game.combo * .05)));
  hideBossBar();
}

/* ---- Boss 通用更新 ---- */
function updateBoss(dt) {
  const b = boss; if (!b) return;
  b.t += dt;
  if (b.flash > 0) b.flash -= dt;
  for (const p of b.parts) if (p.flash > 0) p.flash -= dt;

  if (b.enter > 0) {                     // 登場：由上方降下
    b.enter -= dt;
    b.y = lerp(-160, b.def.homeY, 1 - b.enter / 110);
    if (b.def.follow) b.def.follow(b);    // 巨蟲：讓體節跟上頭部
    b.parts.forEach(p => partPos(b, p));
    return;
  }
  if (b.dying > 0) {                     // 擊破演出：連鎖爆炸
    b.dying -= dt;
    if (game.tick % 9 === 0) {
      const a = rnd(0, TAU), d = rnd(10, 100);
      explode(b.x + Math.cos(a) * d, b.y + Math.sin(a) * d, rnd(1.6, 3.4));
    }
    if (b.dying < 20) flashScreen(.5, 'rgb(255,255,255)');
    b.y += .35 * dt;
    b.parts.forEach(p => partPos(b, p));
    if (b.dying <= 0) { boss = null; stageCleared(); }
    return;
  }

  const ph = b.def.phases[b.phase];
  if (ph.update) ph.update(b, dt);
  b.parts.forEach(p => partPos(b, p));

  /* 時間軸排程 */
  b.pt += dt;
  while (b.si < ph.script.length && b.pt >= ph.script[b.si].t) {
    const st = ph.script[b.si];
    if (!st.cond || st.cond(b)) st.f(b);
    b.si++;
  }
  if (b.pt >= ph.loop) { b.pt -= ph.loop; b.si = 0; }

  /* 與自機接觸 */
  if (player.alive && player.inv <= 0 && dist2(b.x, b.y, player.x, player.y) < (b.def.bodyR + player.hitR) ** 2) playerDamage();
  updateBossBar();
}
function drawBoss() {
  const b = boss; if (!b) return;
  ctx.save(); ctx.translate(b.x, b.y);
  b.def.draw(b, ctx);
  ctx.restore();
  // 部位受擊閃光
  for (const p of b.parts) {
    if (p.dead || p.flash <= 0) continue;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(p.flash / 6, 0, 1) * .7;
    drawGlow(soft('rgb(255,255,255)', 32), p.x, p.y, p.r * .055);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  if (b.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(b.flash / 4, 0, 1) * .5;
    drawGlow(soft('rgb(255,255,255)', 40), b.x, b.y, b.def.bodyR * .05);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // 部位血條
  for (const p of b.parts) {
    if (p.dead || p.hidden || p.hp >= p.maxhp) continue;
    const w = p.r * 1.8;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(p.x - w / 2, p.y - p.r - 9, w, 3);
    ctx.fillStyle = '#ffd05c'; ctx.fillRect(p.x - w / 2, p.y - p.r - 9, w * clamp(p.hp / p.maxhp, 0, 1), 3);
  }
}

/** 螺旋彈：兩條反向旋轉的臂 */
function spiralTick(b, mode) {
  b.c = (b.c || 0) + 1;
  const base = b.c * (mode ? -.42 : .34);
  const arms = mode ? 4 : 3;
  for (let i = 0; i < arms; i++) {
    const bl = eb(b.x, b.y, base + i * TAU / arms, mode ? 3.4 : 2.9,
      mode ? COL.cyan : COL.mag, 6, mode ? EB_NEEDLE : EB_ORB);
    if (!mode) bl.acc = .006;
  }
}

    b.acc = .012; b.maxsp = 6;
  }
}

    // 熔岩口
    g.globalCompositeOperation = 'lighter';
    drawGlow(glow('rgb(255,120,20)', 28), 0, -6, 1.0 + Math.sin(b.t * .18) * .22);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#ffe9a8';
    g.beginPath(); g.ellipse(0, -6, 10, 13, 0, 0, TAU); g.fill();
    // 眼
    g.fillStyle = '#ffe14d';
    [-1, 1].forEach(s => { g.beginPath(); g.ellipse(s * 12, -22, 4, 6, s * .4, 0, TAU); g.fill(); });
    g.restore();
    // 潛行中的預警影子
    if (b.mode === 2) {
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = .35 + Math.abs(Math.sin(b.t * .25)) * .4;
      g.fillStyle = 'rgb(255,90,20)';
      g.beginPath(); g.ellipse(b.x, PFH - 44, 46, 16, 0, 0, TAU); g.fill();

      g.globalCompositeOperation = 'source-over';
    }
    g.translate(b.x, b.y);
  }
};

/** 格狀彈幕：整排從畫面上緣落下，留下可鑽過的縫隙 */
function gridBarrage(sp, col) {
  const gap = rndi(0, 9);
  for (let i = 0; i < 10; i++) {
    if (i === gap || i === gap + 1) continue;
    const x = 30 + i * (PFW - 60) / 9;
    eb(x, -10, Math.PI / 2, sp, col, 7, EB_ORB);
    eb(x, -46, Math.PI / 2, sp, col, 7, EB_ORB);
  }
}
/** 奇點多層彈幕 */
function omegaLayer(b, mode) {
  b.c = (b.c || 0) + 1;
  if (mode === 0) { for (let i = 0; i < 5; i++) eb(b.x, b.y, b.c * .27 + i * TAU / 5, 3.2, COL.mag, 6, EB_RICE); }
  else if (mode === 1) { for (let i = 0; i < 5; i++) eb(b.x, b.y, -b.c * .31 + i * TAU / 5, 2.8, COL.cyan, 6, EB_ORB); }
  else { for (let i = 0; i < 6; i++) { const x = eb(b.x, b.y, b.c * .19 + i * TAU / 6, 2.2, COL.purple, 7, EB_STAR); x.turn = .011; } }
}

/* --- 程序化岩層貼圖（第二關用，開場產生一次） --- */
let rockTile = null;
function buildRockTile() {
  const c = offc(PFW, 512), g = c.getContext('2d');
  g.fillStyle = '#0b0503'; g.fillRect(0, 0, PFW, 512);
  for (let i = 0; i < 260; i++) {
    const x = rnd(0, PFW), y = rnd(0, 512), r = rnd(14, 62);
    g.fillStyle = 'rgba(' + rndi(20, 44) + ',' + rndi(11, 22) + ',' + rndi(8, 15) + ',.9)';
    g.beginPath();
    for (let k = 0; k < 7; k++) { const a = k * TAU / 7; const rr = r * rnd(.6, 1.15); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  }
  for (let i = 0; i < 30; i++) {      // 熔岩裂縫（細、暗，只作為紋理）
    let x = rnd(0, PFW), y = rnd(0, 512);
    g.strokeStyle = 'rgba(190,' + rndi(50, 95) + ',18,.22)'; g.lineWidth = rnd(.8, 1.8);
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) {
      const nx = x + rnd(-26, 26), ny = y + rnd(4, 30);
      g.quadraticCurveTo(x + rnd(-14, 14), (y + ny) / 2, nx, ny); x = nx; y = ny;
    }
    g.stroke();
  }
  rockTile = c;
}

const BG = {

        g.fillStyle = s.z > .75 ? '#dff0ff' : '#8fb8ff';
        g.fillRect(s.x, s.y, s.s, s.s * (1 + s.z * 2.2));
      }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      for (const d of this.deb) {          // 殘骸剪影
        g.save(); g.translate(d.x, d.y); g.rotate(d.a);
        g.fillStyle = 'rgba(18,26,52,.92)'; g.strokeStyle = 'rgba(90,140,220,.35)'; g.lineWidth = 1.4;
        g.beginPath();
        for (let k = 0; k < d.n; k++) { const a = k * TAU / d.n; const rr = d.r * (.6 + ((k * 7919) % 100) / 250); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }

  /* ---------- 第二關：熔核地表 ---------- */

function addScore(n) {

function bumpCombo() {
  game.chain++; game.comboT = 120;

}
function breakCombo() { game.chain = 0; game.combo = 1; game.comboT = 0; }
function addShake(v) { game.shake = Math.min(26, game.shake + v); }

function onGraze(b) {
  game.graze++;
  player.burst = Math.min(player.burstMax, player.burst + .55 * player.burstGain);
  addScore(30 * game.combo);
  spark(b.x, b.y, 1, 'rgb(180,240,255)', 1.6, 3, 12);
  Audio_.graze();
}

/* ---------------- 敵彈更新／繪製 ---------------- */
function updateEbs(dt) {
  const P = player;
  ebs.each(b => {
    if (b.turn) b.ang += b.turn * dt;
    if (b.homing > 0) {
      b.homing -= dt;
      let d = ((aimP(b.x, b.y) - b.ang + Math.PI * 3) % TAU) - Math.PI;
      b.ang += clamp(d, -.032, .032) * dt;
    }
    if (b.acc) b.sp = clamp(b.sp + b.acc * dt, b.minsp, b.maxsp);
    b.x += Math.cos(b.ang) * b.sp * dt;
    b.y += Math.sin(b.ang) * b.sp * dt;
    b.rot += b.spin * dt;

    if (b.bounce > 0) {
      if (b.x < b.r) { b.x = b.r; b.ang = Math.PI - b.ang; b.bounce--; spark(b.x, b.y, 2, b.col, 1.6, 3, 10); }
      else if (b.x > PFW - b.r) { b.x = PFW - b.r; b.ang = Math.PI - b.ang; b.bounce--; spark(b.x, b.y, 2, b.col, 1.6, 3, 10); }
      if (b.y < b.r) { b.y = b.r; b.ang = -b.ang; b.bounce--; spark(b.x, b.y, 2, b.col, 1.6, 3, 10); }
    }
    if (b.splitN > 0) {
      b.splitT -= dt;
      if (b.splitT <= 0) {
        ring(b.x, b.y, b.splitN, b.splitSp, rnd(0, TAU), b.splitCol, 6, EB_RICE);
        spark(b.x, b.y, 6, b.splitCol, 2.4, 4, 16);
        ebs.kill(b); return;
      }
    }
    b.life -= dt;
    const m = 70;
    if (b.life <= 0 || b.x < -m || b.x > PFW + m || b.y < -m || b.y > PFH + m) { ebs.kill(b); return; }

    if (P.alive && game.state !== 'RESULT') {
      const d2 = dist2(b.x, b.y, P.x, P.y);
      const hr = P.hitR + b.r * .58;
      if (d2 < hr * hr) { if (P.inv <= 0) { playerDamage(); ebs.kill(b); return; } }
      else if (!b.grazed) {
        const gr = P.grazeR + b.r;
        if (d2 < gr * gr) { b.grazed = 1; onGraze(b); }
      }
    }
  });
}
function drawEbs() {
  ctx.globalCompositeOperation = 'lighter';
  const streak = player.zero ? 1 : 0;
  ebs.each(b => {
    const s = b.r / 8;
    switch (b.t) {
      case EB_ORB:
        drawGlow(glow(b.col, 16), b.x, b.y, s * 1.15); break;
      case EB_BALL:
        drawGlow(soft(b.col, 24), b.x, b.y, s * 1.5);
        drawGlow(glow(b.col, 16), b.x, b.y, s); break;
      case EB_NEEDLE: {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
        ctx.fillStyle = b.col; ctx.globalAlpha = .55;
        ctx.fillRect(-b.r * 2.4, -b.r * .55, b.r * 4.4, b.r * 1.1);
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
        ctx.fillRect(-b.r * 1.8, -b.r * .22, b.r * 3.4, b.r * .44);
        ctx.restore(); break; }
      case EB_RICE: {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
        ctx.fillStyle = b.col; ctx.globalAlpha = .75;
        ctx.beginPath(); ctx.ellipse(0, 0, b.r * 1.7, b.r * .78, 0, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(0, 0, b.r * .9, b.r * .40, 0, 0, TAU); ctx.fill();
        ctx.restore(); break; }
      case EB_STAR: {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot * 2);
        ctx.fillStyle = b.col;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i * TAU / 8, rr = i % 2 ? b.r * .5 : b.r * 1.75; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, b.r * .45, 0, TAU); ctx.fill();
        ctx.restore(); break; }
      case EB_GEM: {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
        ctx.fillStyle = b.col;
        ctx.beginPath(); ctx.moveTo(b.r * 1.7, 0); ctx.lineTo(0, b.r); ctx.lineTo(-b.r * 1.7, 0); ctx.lineTo(0, -b.r);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(-b.r * .35, -b.r * .35, b.r * .7, b.r * .7);
        ctx.restore(); break; }
    }
    if (streak) {   // 零時領域：拖曳殘影
      ctx.globalAlpha = .30;
      drawGlow(soft(b.col, 20), b.x - Math.cos(b.ang) * b.sp * 2.2, b.y - Math.sin(b.ang) * b.sp * 2.2, b.r / 9);
      ctx.globalAlpha = 1;
    }
  });
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 自機彈更新／繪製 ---------------- */
function findTarget(x, y) {
  let best = null, bd = 1e9;
  enemies.each(e => { const d = dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } });
  if (boss && !boss.dying && boss.enter <= 0) {
    for (const p of boss.parts) {
      if (p.dead || p.hidden) continue;
      const d = dist2(x, y, p.x, p.y); if (d < bd) { bd = d; best = p; }
    }
    const d = dist2(x, y, boss.x, boss.y); if (d < bd) { bd = d; best = boss; }
  }
  return best;
}
function updatePbs(dt) {
  pbs.each(b => {
    if (b.t === PB_MISSILE) {
      if (!b.target || b.target.alive === false || b.target.dead === true) {
        if (game.tick % 4 === 0 || !b.target) b.target = findTarget(b.x, b.y);
      }
      if (b.target) {
        const ta = angTo(b.x, b.y, b.target.x, b.target.y);
        let d = ((ta - b.ang + Math.PI * 3) % TAU) - Math.PI;
        b.ang += clamp(d, -.11, .11) * dt;
      }
      const sp = Math.min(13, Math.hypot(b.vx, b.vy) + .55 * dt);
      b.vx = Math.cos(b.ang) * sp; b.vy = Math.sin(b.ang) * sp;
      if (game.tick % 2 === 0) smoke(b.x, b.y, 1, 'rgb(255,180,90)', .4, 3.5, 12);
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.y < -40 || b.y > PFH + 40 || b.x < -60 || b.x > PFW + 60) { pbs.kill(b); return; }

    let done = false;
    enemies.each(e => {
      if (done || b.hitList.indexOf(e) >= 0) return;
      const rr = e.r + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        damageEnemy(e, b.dmg, b.x, b.y);
        Audio_.hit();
        if (b.t === PB_MISSILE) { explode(b.x, b.y, .9, 'rgb(255,170,60)', 'rgb(255,240,180)'); pbs.kill(b); done = true; }
        else if (b.pierce > 0) { b.pierce--; b.hitList.push(e); }
        else { spark(b.x, b.y, 2, 'rgb(255,240,180)', 2, 3, 10); pbs.kill(b); done = true; }
      }
    });
    if (done) return;

    if (boss && !boss.dying && boss.enter <= 0) {
      for (const p of boss.parts) {
        if (p.dead || p.hidden || !p.hittable || b.hitList.indexOf(p) >= 0) continue;
        const rr = p.r + b.r;
        if (dist2(b.x, b.y, p.x, p.y) < rr * rr) {
          damageBoss(p, b.dmg); Audio_.hit();
          if (b.t === PB_MISSILE) { explode(b.x, b.y, .9, 'rgb(255,170,60)', 'rgb(255,240,180)'); pbs.kill(b); return; }
          if (b.pierce > 0) { b.pierce--; b.hitList.push(p); return; }
          spark(b.x, b.y, 2, 'rgb(255,240,180)', 2, 3, 10); pbs.kill(b); return;
        }
      }
      const rr = boss.def.bodyR + b.r;
      if (dist2(b.x, b.y, boss.x, boss.y) < rr * rr && b.hitList.indexOf(boss) < 0) {
        damageBoss(null, b.dmg); Audio_.hit();
        if (b.t === PB_MISSILE) { explode(b.x, b.y, .9, 'rgb(255,170,60)', 'rgb(255,240,180)'); pbs.kill(b); return; }
        if (b.pierce > 0) { b.pierce--; b.hitList.push(boss); return; }
        spark(b.x, b.y, 2, 'rgb(255,240,180)', 2, 3, 10); pbs.kill(b);
      }
    }
  });
}
function drawPbs() {
  ctx.globalCompositeOperation = 'lighter';
  const wc = WEAPONS[player.weapon].col;
  pbs.each(b => {
    if (b.t === PB_PELLET) {
      drawGlow(glow('rgb(120,230,255)', 16), b.x, b.y, b.r / 9);
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10);
    } else if (b.t === PB_BEAM) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang + Math.PI / 2);
      ctx.globalAlpha = .55; ctx.fillStyle = 'rgb(255,110,220)';
      ctx.fillRect(-b.r, -22, b.r * 2, 44);
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
      ctx.fillRect(-b.r * .38, -20, b.r * .76, 40);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang + Math.PI / 2);
      drawGlow(glow('rgb(150,255,120)', 16), 0, 0, .55);
      ctx.fillStyle = '#eaffdc';
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(5, 6); ctx.lineTo(-5, 6); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  });
  ctx.globalCompositeOperation = 'source-over';
}

/* 雷射對自機的判定與擦彈 */
function laserPlayerCheck(dt) {
  if (!player.alive) return;
  for (const L of lasers) {
    if (L.t < L.warn) continue;
    if (player.inv <= 0 && laserHit(L, player.x, player.y, player.hitR)) { playerDamage(); return; }
    L.grazeT = (L.grazeT || 0) - dt;
    if (L.grazeT <= 0 && laserHit(L, player.x, player.y, player.grazeR)) {
      L.grazeT = 8; onGraze({ x: player.x, y: player.y });
    }
  }
}

/* =====================================================================
   流程控制
   ===================================================================== */
function clearField() {
  ebs.clear(); pbs.clear(); enemies.clear(); items.clear(); parts.clear();
  lasers.length = 0; game.timers.length = 0; boss = null; hideBossBar();
}
function startGame() {
  game.score = 0; game.kills = 0; game.graze = 0; game.maxCombo = 1; game.deaths = 0;
  game.continues = 0; game.cleared = false;
  breakCombo();
  player.ship = player.ship || 0;
  resetPlayer(true);
  game.stage = clamp((QSTAGE || QBOSS || 1) - 1, 0, 2);
  beginStage();
}
function beginStage() {
  clearField();
  const S = STAGES[game.stage];
  game.stageT = QBOSS ? S.len : 0;
  game.waveI = QBOSS ? S.waves.length : 0;
  game.stageStart = { kills: game.kills, graze: game.graze, score: game.score, deaths: game.deaths };
  game.bg = BG[S.bg]; game.bg.init();
  game.rank = clamp(game.stage * .6 + game.continues * -.2, 0, 4);
  resetPlayer(false);
  game.state = 'INTRO'; game.intro = 150;
  screenIntro();
  Audio_.bgm.play(S.bgm);
}
function toPlay() { game.state = 'PLAY'; setCenter(''); }
function toWarning() {
  game.state = 'WARN'; game.warn = 165; screenWarning(); Audio_.warn();
  ebs.each(b => ebs.kill(b));
}
function stageCleared() {
  game.state = 'RESULT';
  clearField();
  screenResult();
  Audio_.bgm.stop();
}
function nextStage() {
  if (game.stage >= STAGES.length - 1) { game.state = 'ENDING'; game.cleared = true; clearField(); screenEnding(); return; }
  game.stage++;
  beginStage();
}
function gameOver() {
  game.state = 'GAMEOVER'; game.over = 9 * SEC;
  Audio_.bgm.stop(); screenGameOver();
}
function doContinue() {
  game.continues++;
  player.lives = 2; player.burst = 60;
  player.lv = [Math.max(2, player.lv[0]), Math.max(2, player.lv[1]), Math.max(2, player.lv[2])];
  resetPlayer(false);
  breakCombo();
  ebs.clear(); lasers.length = 0;
  setCenter('');
  game.state = boss ? 'BOSS' : 'PLAY';
  Audio_.bgm.play(STAGES[game.stage].bgm);
}
function toTitle() {
  clearField();
  // 回到標題時把 HUD 歸零，不留上一輪的殘機與武裝狀態
  player.lives = 3; player.options = 0; player.lv = [1, 1, 1]; player.burst = 0; player.weapon = 0;
  game.stage = 0; game.combo = 1; game.graze = 0; game.score = 0;
  game.bg = BG.space; game.bg.init();
  game.state = 'TITLE'; Audio_.bgm.stop(); screenTitle();
}
function togglePause() {
  if (game.state !== 'PLAY' && game.state !== 'BOSS') return;
  game.paused = !game.paused;
  elPause.style.display = game.paused ? 'flex' : 'none';
}

/* =====================================================================
   主更新
   ===================================================================== */
function updateStageWaves(dt) {
  const S = STAGES[game.stage];
  game.stageT += dt;
  while (game.waveI < S.waves.length && game.stageT >= S.waves[game.waveI].t) {
    S.waves[game.waveI].f(); game.waveI++;
  }
  for (let i = game.timers.length - 1; i >= 0; i--) {
    if (game.stageT >= game.timers[i].t) { game.timers[i].f(); game.timers.splice(i, 1); }
  }
  // 波次結束且場面清空 → Boss 登場
  if (game.waveI >= S.waves.length && game.stageT > S.len && enemies.count() === 0) toWarning();
}

function update() {
  game.tick++;
  Audio_.bgm.tick();

  if (game.paused) return;

  /* 時間縮放：擊破慢動作 / 零時領域 */
  let ts = 1;
  if (game.slow > 0) { game.slow--; ts = .30; }
  if (player.zero && (game.state === 'PLAY' || game.state === 'BOSS')) ts = Math.min(ts, .35);
  const dt = ts;

  if (game.shake > 0) game.shake = Math.max(0, game.shake - .55);
  if (game.flash > 0) game.flash = Math.max(0, game.flash - .045);
  if (game.burstFx > 0) game.burstFx--;
  if (game.comboT > 0) { game.comboT -= dt; if (game.comboT <= 0) breakCombo(); }
  game.rank = clamp(game.stage * .6 + (player.lv[player.weapon] - 1) * .35 + player.options * .18 - game.continues * .3, 0, 4);

  switch (game.state) {
    case 'TITLE':
      if (confirmEdge) { screenSelect(); game.state = 'SELECT'; }
      break;
    case 'SELECT':
      if (menuDelta) { player.ship = (player.ship + menuDelta + 3) % 3; screenSelect(); Audio_.power(); }
      if (confirmEdge) { startGame(); }
      paintShipPreviews();
      break;
    case 'INTRO':
      game.bg.update(dt);
      game.intro -= 1;
      if (game.intro <= 0 || confirmEdge) toPlay();
      break;
    case 'WARN':
      game.bg.update(dt);
      updateParts(dt); updatePlayer(dt); updatePbs(dt);
      game.warn -= 1;
      if (game.warn <= 0) { setCenter(''); startBoss(STAGES[game.stage].boss); }
      break;
    case 'PLAY':
      game.bg.update(dt);
      updateStageWaves(dt);
      updatePlayer(dt); updateEnemies(dt); updatePbs(dt); updateEbs(dt);
      updateLasers(dt); laserPlayerCheck(dt); updateItems(dt); updateParts(dt);
      break;
    case 'BOSS':
      game.bg.update(dt);
      updateBoss(dt);
      updatePlayer(dt); updateEnemies(dt); updatePbs(dt); updateEbs(dt);
      updateLasers(dt); laserPlayerCheck(dt); updateItems(dt); updateParts(dt);
      game.stageT += dt;                 // 波次遺留的延遲生成仍以絕對時間結算
      for (let i = game.timers.length - 1; i >= 0; i--) {
        if (game.stageT >= game.timers[i].t) { game.timers[i].f(); game.timers.splice(i, 1); }
      }
      break;
    case 'RESULT':
      game.bg.update(dt); updateParts(dt);
      if (confirmEdge) nextStage();
      break;
    case 'ENDING':
      game.bg && game.bg.update(dt); updateParts(dt);
      if (confirmEdge) toTitle();
      break;
    case 'GAMEOVER':
      game.bg && game.bg.update(dt); updateParts(dt); updateEbs(dt);
      game.over -= 1;
      if (game.over % 30 === 0) screenGameOver();
      if (confirmEdge) doContinue();
      else if (game.over <= 0) toTitle();
      break;
  }

  updateHUD();
  confirmEdge = false; menuDelta = 0; wepEdge = 0; wepPick = -1;
}

/* =====================================================================
   繪製
   ===================================================================== */
function drawSidePanels() {
  for (const side of [0, 1]) {
    const x = side ? PFX + PFW : 0;
    const g = ctx.createLinearGradient(x, 0, x + 180, 0);
    if (side) { g.addColorStop(0, '#0a1428'); g.addColorStop(.15, '#060c18'); g.addColorStop(1, '#04070f'); }
    else { g.addColorStop(0, '#04070f'); g.addColorStop(.85, '#060c18'); g.addColorStop(1, '#0a1428'); }
    ctx.fillStyle = g; ctx.fillRect(x, 0, 180, H);
    // 電路紋路
    ctx.strokeStyle = 'rgba(60,160,255,.12)'; ctx.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const y = 40 + i * 78;
      ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 60 + (i % 3) * 30, y);
      ctx.lineTo(x + 90 + (i % 2) * 40, y + 26); ctx.lineTo(x + 170, y + 26); ctx.stroke();
    }
  }
  // 戰場邊框光帶
  ctx.globalCompositeOperation = 'lighter';
  const pulse = .45 + Math.sin(game.tick * .05) * .12;
  for (const x of [PFX, PFX + PFW]) {
    const g = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
    g.addColorStop(0, 'rgba(0,150,255,0)'); g.addColorStop(.5, 'rgba(90,220,255,' + pulse + ')'); g.addColorStop(1, 'rgba(0,150,255,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 8, 0, 16, H);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function render() {
  ctx.fillStyle = '#03040a'; ctx.fillRect(0, 0, W, H);
  drawSidePanels();

  ctx.save();
  ctx.beginPath(); ctx.rect(PFX, 0, PFW, PFH); ctx.clip();
  const sh = game.shake;
  ctx.translate(PFX + (sh ? rnd(-sh, sh) : 0), sh ? rnd(-sh, sh) : 0);

  if (game.bg) game.bg.draw(ctx);
  else { ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, PFW, PFH); }

  if (game.state !== 'TITLE' && game.state !== 'SELECT') {
    drawItems();
    drawEnemies();
    drawBoss();
    drawLasers();
    drawPbs();
    drawPlayer();
    drawEbs();
    drawParts();
  } else {
    drawParts();
  }

  // 零時領域畫面色調
  if (player.zero && (game.state === 'PLAY' || game.state === 'BOSS')) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(140,190,255,.85)'; ctx.fillRect(0, 0, PFW, PFH);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(20,60,140,.35)'; ctx.fillRect(0, 0, PFW, PFH);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(160,220,255,.25)'; ctx.lineWidth = 1;
    for (let y = (game.tick * 3) % 26; y < PFH; y += 26) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(PFW, y); ctx.stroke(); }
  }
  // BURST 全屏能量波
  if (game.burstFx > 0) {
    const k = 1 - game.burstFx / 46;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (1 - k) * .8;
    ctx.strokeStyle = 'rgb(180,245,255)'; ctx.lineWidth = 40 * (1 - k) + 4;
    ctx.beginPath(); ctx.arc(player.x, player.y, k * 780, 0, TAU); ctx.stroke();
    ctx.globalAlpha = (1 - k) * .30;
    ctx.fillStyle = 'rgb(120,200,255)'; ctx.fillRect(0, 0, PFW, PFH);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  // 全畫面閃光
  if (game.flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(game.flash, 0, 1) * .75;
    ctx.fillStyle = game.flashCol; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  // BURST 色差殘影（只處理戰場區域，避免整張畫布重繪的成本）
  if (game.burstFx > 24) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .22;
    ctx.drawImage(cvs, PFX, 0, PFW, PFH, PFX - 5, 0, PFW, PFH);
    ctx.drawImage(cvs, PFX, 0, PFW, PFH, PFX + 5, 0, PFW, PFH);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  if (DEBUG) {
    elDbg.style.display = 'block';
    elDbg.innerHTML = 'FPS ' + game.fps.toFixed(0) + ' | state ' + game.state +
      '<br>EB ' + ebs.count() + ' PB ' + pbs.count() + ' EN ' + enemies.count() +
      ' PT ' + parts.count() + ' LZ ' + lasers.length +
      '<br>stageT ' + (game.stageT | 0) + ' wave ' + game.waveI + ' rank ' + game.rank.toFixed(2) +
      (boss ? '<br>BOSS p' + (boss.phase + 1) + ' hp ' + (boss.hp | 0) + '/' + boss.maxhp +
        ' parts ' + boss.parts.filter(p => !p.dead).length : '');
  }
}

/* =====================================================================
   主迴圈（固定步進 1/60）
   ===================================================================== */
let acc = 0, lastT = performance.now(), fpsT = performance.now(), fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let d = now - lastT; lastT = now;
  if (d > 250) d = 250;
  acc += d;
  const step = 1000 / 60;
  let guard = 0;
  while (acc >= step && guard++ < 5) { update(); acc -= step; }
  render();
  fpsN++;
  if (now - fpsT > 500) { game.fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
}

/* ---- 啟動 ---- */
buildRockTile();
BG.space.init(); game.bg = BG.space;
screenTitle();
if (QSTAGE || QBOSS || AUTO) {           // 除錯捷徑：直接開打
  player.ship = 2;
  startGame();
  if (QBOSS) { player.lv = [4, 4, 4]; player.options = 2; player.burst = 100; }
}
requestAnimationFrame(frame);

</script>
