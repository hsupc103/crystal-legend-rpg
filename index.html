<script>
"use strict";
/* =====================================================================
   水晶傳說 Crystal Legend — 致敬 Final Fantasy IV 風格的原創 RPG
   機制參考：ATB 戰鬥、三階元素魔法、召喚獸、藍漸層視窗、水晶琶音配樂
   所有程式、美術、音樂皆為原創。
   ===================================================================== */
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
const W = 960, H = 600;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

/* ============================ 音效系統 ============================ */
const Snd = {
  ctx:null, master:null, musGain:null, loopTimer:null, curSong:null, enabled:true,
  init(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
    this.musGain = this.ctx.createGain(); this.musGain.gain.value = 0.42;
    // 水晶殘響：回授延遲
    const dly = this.ctx.createDelay(); dly.delayTime.value = 0.27;
    const fb = this.ctx.createGain(); fb.gain.value = 0.32;
    dly.connect(fb); fb.connect(dly);
    this.musGain.connect(this.master);
    this.musGain.connect(dly); dly.connect(this.master);
  },
  mf(m){ return 440*Math.pow(2,(m-69)/12); },
  tone(midi, t, dur, wave='triangle', vol=0.3, dest){
    if(!this.ctx||!this.enabled) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = wave; o.frequency.value = this.mf(midi);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.musGain);
    o.start(t); o.stop(t+dur+0.05);
  },
  noise(t, dur, vol=0.3, freq=1200){
    if(!this.ctx||!this.enabled) return;
    const len = Math.floor(this.ctx.sampleRate*dur);
    const buf = this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  sweep(f0,f1,dur,vol=0.25,wave='sawtooth'){
    if(!this.ctx||!this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type=wave; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.05);
  },
  sfx(kind){
    if(!this.ctx||!this.enabled) return;
    const t = this.ctx.currentTime;
    switch(kind){
      case 'cursor': this.tone(88,t,0.07,'square',0.12,this.master); break;
      case 'confirm': this.tone(76,t,0.06,'square',0.15,this.master); this.tone(83,t+0.06,0.1,'square',0.15,this.master); break;
      case 'cancel': this.tone(70,t,0.09,'square',0.12,this.master); break;
      case 'hit': this.noise(t,0.16,0.4,900); this.tone(45,t,0.12,'square',0.2,this.master); break;
      case 'crit': this.noise(t,0.25,0.55,1400); this.sweep(600,80,0.25,0.3); break;
      case 'fire': this.noise(t,0.5,0.4,600); this.sweep(200,700,0.4,0.2); break;
      case 'ice': this.tone(96,t,0.3,'sine',0.2,this.master); this.tone(103,t+0.08,0.35,'sine',0.15,this.master); this.noise(t+0.1,0.3,0.2,4000); break;
      case 'thunder': this.noise(t,0.35,0.6,2500); this.sweep(1200,60,0.35,0.35); break;
      case 'heal': [72,76,79,84].forEach((m,i)=>this.tone(m,t+i*0.09,0.4,'sine',0.18,this.master)); break;
      case 'summon': this.sweep(80,900,1.2,0.25,'sawtooth'); this.noise(t+0.3,1.0,0.2,800); break;
      case 'megaflare': this.noise(t,1.6,0.7,500); this.sweep(1000,40,1.5,0.4); break;
      case 'zantetsu': this.noise(t,0.1,0.5,6000); this.noise(t+0.15,0.1,0.5,6000); this.noise(t+0.3,0.35,0.6,3000); break;
      case 'die': this.sweep(300,40,0.6,0.25,'square'); break;
      case 'levelup': [67,71,74,79,83].forEach((m,i)=>this.tone(m,t+i*0.08,0.35,'triangle',0.2,this.master)); break;
      case 'buy': this.tone(84,t,0.08,'square',0.15,this.master); this.tone(91,t+0.08,0.15,'square',0.15,this.master); break;
      case 'warn': this.tone(46,t,0.4,'sawtooth',0.25,this.master); this.tone(47,t+0.45,0.4,'sawtooth',0.25,this.master); break;
    }
  },
  /* --- 循環樂曲排程器（樂曲皆為原創） --- */
  playSong(song){
    if(!this.ctx) return;
    if(this.curSong === song) return;
    this.stopSong();
    if(!song || !this.enabled) return;
    this.curSong = song;
    const spb = 60/song.bpm;
    const loopLen = song.beats*spb;
    const schedule = (t0) => {
      if(this.curSong !== song) return;
      for(const tr of song.tracks)
        for(const n of tr.notes)
          this.tone(n[1], t0+n[0]*spb, Math.max(0.1,(n[2]||0.5)*spb*0.95), tr.wave, tr.vol);
      this.loopTimer = setTimeout(()=>schedule(t0+loopLen), (t0+loopLen-this.ctx.currentTime-0.35)*1000);
    };
    schedule(this.ctx.currentTime+0.08);
  },
  stopSong(){ this.curSong=null; if(this.loopTimer){clearTimeout(this.loopTimer); this.loopTimer=null;} },
  toggle(){ this.enabled=!this.enabled; if(!this.enabled) this.stopSong(); return this.enabled; }
};

/* --- 原創樂曲資料 --- */
function arp(root, minor, startBeat, beats){
  // 水晶風琶音：根-五-八-十度來回
  const seq = [0,7,12,minor?15:16,19,minor?15:16,12,7];
  const notes = [];
  for(let b=0;b<beats;b++) notes.push([startBeat+b, root+seq[b%8], 0.9]);
  return notes;
}
const SONG_FIELD = (()=>{ // 「水晶原野」原創曲
  const harp = [];
  const prog = [[57,1],[53,0],[48,0],[55,0],[57,1],[53,0],[50,1],[52,0]];
  prog.forEach((c,i)=>harp.push(...arp(c[0],!!c[1],i*8,8)));
  const mel = [ // 悠揚長音旋律
    [0,76,4],[4,72,3],[8,72,4],[12,69,3],[16,67,4],[20,72,3],[24,74,6],
    [32,76,4],[36,79,3],[40,77,4],[44,74,3],[48,74,4],[52,69,2],[54,71,2],[56,76,7]
  ];
  const bass = prog.map((c,i)=>[i*8,c[0]-24,7.5]);
  return { bpm:92, beats:64, tracks:[
    {wave:'triangle',vol:0.16,notes:harp},
    {wave:'sine',vol:0.14,notes:mel},
    {wave:'sine',vol:0.20,notes:bass} ]};
})();
const SONG_BATTLE = (()=>{ // 「劍與魔力」原創戰鬥曲
  const bass=[], roots=[40,45,43,47];
  roots.forEach((r,i)=>{ for(let b=0;b<8;b++) bass.push([i*8+b, b%4===3?r+7:r, 0.5]); });
  const lead = [
    [0,64,1],[1,67,1],[2,71,1],[3,76,1],[4,74,2],[6,71,1],[7,67,1],
    [8,72,1],[9,71,1],[10,69,1],[11,71,1],[12,72,1],[13,74,1],[14,76,2],
    [16,71,1],[17,69,1],[18,67,1],[19,66,1],[20,67,1],[21,69,1],[22,71,1],[23,74,1],
    [24,66,1],[25,67,1],[26,69,1],[27,71,2],[29,69,1],[30,66,1],[31,64,1]
  ];
  const perc=[]; for(let b=0;b<32;b+=2) perc.push([b,33,0.3]);
  return { bpm:150, beats:32, tracks:[
    {wave:'square',vol:0.10,notes:bass},
    {wave:'sawtooth',vol:0.09,notes:lead},
    {wave:'triangle',vol:0.15,notes:perc} ]};
})();
const SONG_BOSS = (()=>{ // 「深淵之皇」原創魔王曲
  const bass=[], pat=[36,36,42,36,36,37,42,41];
  for(let r=0;r<4;r++) pat.forEach((m,i)=>bass.push([r*8+i, m, 0.85]));
  const stab=[[0,60,0.5],[3,66,0.5],[8,59,0.5],[11,65,0.5],[16,60,0.5],[19,66,0.5],[22,67,0.5],[24,71,3],[28,66,3]];
  const choir=[[0,72,8],[8,71,8],[16,72,8],[24,74,8]];
  return { bpm:104, beats:32, tracks:[
    {wave:'sawtooth',vol:0.12,notes:bass},
    {wave:'square',vol:0.07,notes:stab},
    {wave:'sine',vol:0.10,notes:choir} ]};
})();
function playVictory(){ // 原創勝利小樂句
  if(!Snd.ctx||!Snd.enabled) return;
  Snd.stopSong();
  const t = Snd.ctx.currentTime;
  [[0,72],[0.12,76],[0.24,79],[0.36,84]].forEach(n=>Snd.tone(n[1],t+n[0],0.3,'square',0.16,Snd.master));
  [[0.6,77],[0.6,81],[0.6,84]].forEach(n=>Snd.tone(n[1],t+n[0],0.5,'triangle',0.13,Snd.master));
  [[1.15,79],[1.15,84],[1.15,88]].forEach(n=>Snd.tone(n[1],t+n[0],1.1,'triangle',0.13,Snd.master));
}

const party = HERO_DEFS.map((d,i)=>{
  const h = { idx:i, name:d.name, cls:d.cls, color:d.color, lv:1, exp:0,
    weapon:d.weapon, armor:d.armor, def:d.def, status:{}, defending:false, atb:0 };

  hasBird:false, hasAirship:false };

/* --- 存檔系統 --- */
const SAVE_KEY = 'crystal-legend-save';
function saveGame(){
  const data = {
    party: party.map(h=>({lv:h.lv,exp:h.exp,hp:h.hp,mp:h.mp,maxhp:h.maxhp,maxmp:h.maxmp,
      atk:h.atk,def:h.def,mag:h.mag,spd:h.spd,weapon:h.weapon,armor:h.armor})),
    gil:inv.gil, items:inv.items, ownedW:inv.ownedW, ownedA:inv.ownedA,
    hasBird:inv.hasBird, hasAirship:inv.hasAirship, mode:player.mode,
    px:player.x, py:player.y, bossDefeated
  };
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); return true; }
  catch(e){ return false; }
}
function loadGame(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!d || !d.party) return false;
    d.party.forEach((s,i)=>{
      Object.assign(party[i], s);
      party[i].status={}; party[i].defending=false; party[i].atb=0;
    });
    inv.gil=d.gil; inv.items=d.items||{}; inv.ownedW=d.ownedW||{}; inv.ownedA=d.ownedA||{};
    inv.hasBird=!!d.hasBird; inv.hasAirship=!!d.hasAirship; player.mode=d.mode||0;
    player.x=d.px; player.y=d.py; bossDefeated=!!d.bossDefeated;
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

function expNext(lv){ return Math.floor(24*Math.pow(lv,1.42)); }
function heroAtk(h){ const w=WEAPONS[h.weapon]; return h.atk + (w.atk||0); }
function heroMag(h){ const w=WEAPONS[h.weapon]; return h.mag + (w.mag||0); }
function heroDef(h){ const a=ARMORS[h.armor]; return h.def + (a.def||0); }
function knownSpells(h){
  const d = HERO_DEFS[h.idx], out=[];
  if(d.learn) for(const [lv,id] of d.learn) if(h.lv>=lv) out.push(id);
  return out;
}
function knownSummons(h){
  const d = HERO_DEFS[h.idx], out=[];
  if(d.learnSummon) for(const [lv,id] of d.learnSummon) if(h.lv>=lv) out.push(id);
  return out;
}
function gainExp(amount, msgs){
  for(const h of party){
    if(h.hp<=0) continue;
    h.exp += amount;
    while(h.exp >= expNext(h.lv)){
      h.exp -= expNext(h.lv); h.lv++;
      const g = HERO_DEFS[h.idx].grow;
      h.maxhp+=g.hp; h.maxmp+=g.mp; h.atk+=g.atk; h.def+=g.def; h.mag+=g.mag;
      h.hp=clamp(h.hp+g.hp,0,h.maxhp); h.mp=clamp(h.mp+g.mp,0,h.maxmp);
      msgs.push(`⭐ ${h.name} 升到 Lv${h.lv}！`);
      const d = HERO_DEFS[h.idx];
      if(d.learn) for(const [lv,id] of d.learn) if(lv===h.lv) msgs.push(`　${h.name} 習得了 ${SPELLS[id].name}（${SPELLS[id].tier}）！`);
      if(d.learnSummon) for(const [lv,id] of d.learnSummon) if(lv===h.lv) msgs.push(`　${h.name} 與 ${SUMMONS[id].name} 締結了契約！`);
    }
  }
}

/* ============================ 世界地圖 ============================ */
const MW=46, MH=34, TILE=34;
// 0水 1沙 2草 3森 4山 5暗之荒野 6城鎮 7魔王城
let map = [];
function hash2(x,y){ const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function genMap(){
  map = [];
  const cx=MW/2, cy=MH/2;
  for(let y=0;y<MH;y++){
    const row=[];
    for(let x=0;x<MW;x++){
      const dx=(x-cx)/(MW*0.46), dy=(y-cy)/(MH*0.46);
      let d = Math.sqrt(dx*dx+dy*dy) + (hash2(x*0.9,y*0.9)-0.5)*0.22;
      let t;
      if(d>1.0) t=0; else if(d>0.90) t=1; else t=2;
      if(t===2){
        const clump = hash2(Math.floor(x/3),Math.floor(y/3));
        if(clump>0.72 && hash2(x,y)>0.25) t=3;
        else if(hash2(x+50,y+50)>0.94) t=4;
      }
      row.push(t);
    }
    map.push(row);
  }
  // 北方山脈屏障（缺口在 x 21-23）
  for(let x=10;x<36;x++) for(let y=11;y<=12;y++)
    if(map[y][x]!==0 && !(x>=21&&x<=23)) map[y][x]=4;
  // 暗之荒野（魔王城周圍，高等級魔物）
  for(let y=5;y<=10;y++) for(let x=14;x<=31;x++)
    if(map[y][x]!==0 && map[y][x]!==1) map[y][x]=5;
  // 中央通道確保可走
  for(let y=12;y<=26;y++) for(let x=21;x<=23;x++) if(map[y][x]!==0) map[y][x]=2;
  for(let y=5;y<=12;y++) for(let x=21;x<=23;x++) if(map[y][x]!==0) map[y][x]=5;
  map[6][22]=7;   // 魔王城
  map[22][22]=6;  // 水晶鎮
  // 出生點周圍淨空
  for(let y=23;y<=25;y++) for(let x=20;x<=24;x++) if(map[y][x]===3||map[y][x]===4) map[y][x]=2;
}
genMap();
const player = { x:22, y:24, dir:0, step:0, moving:false, mode:0 }; // mode: 0走路 1路行鳥 2飛空艇
let camX=0, camY=0, stepsSinceBattle=0, waterT=0;

function walkable(x,y){
  if(x<0||y<0||x>=MW||y>=MH) return false;
  const t=map[y][x];
  return t!==0 && t!==4;
}

/* ============================ 繪圖：地圖 ============================ */
function drawField(dt){
  waterT += dt;
  const px = player.x*TILE, py = player.y*TILE;
  camX = clamp(px - W/2, 0, MW*TILE-W);
  camY = clamp(py - H/2, 0, MH*TILE-H);
  const x0=Math.floor(camX/TILE), y0=Math.floor(camY/TILE);
  const x1=Math.min(MW-1,x0+Math.ceil(W/TILE)+1), y1=Math.min(MH-1,y0+Math.ceil(H/TILE)+1);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const sx = x*TILE-camX, sy = y*TILE-camY;
    drawTile(map[y][x], sx, sy, x, y);
  }
  // 玩家
  const sx = px-camX, sy = py-camY;
  drawPlayer(sx, sy);
  // 環境光暈
  const grad = ctx.createRadialGradient(sx+TILE/2,sy+TILE/2,60,sx+TILE/2,sy+TILE/2,500);
  grad.addColorStop(0,'rgba(255,250,220,0.06)');
  grad.addColorStop(1,'rgba(0,0,40,0.18)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
}
function drawTile(t, sx, sy, x, y){
  const h = hash2(x,y);
  switch(t){
    case 0: { // 海洋（波光）
      ctx.fillStyle = '#123a8c'; ctx.fillRect(sx,sy,TILE,TILE);
      const s = Math.sin(waterT*2 + x*1.3 + y*2.1);
      if(s>0.55){ ctx.fillStyle='rgba(120,190,255,0.5)';
        ctx.fillRect(sx+5+h*12, sy+8+h*10, 12, 2); }
      ctx.fillStyle='rgba(20,80,180,0.5)'; ctx.fillRect(sx, sy+TILE-4, TILE, 4);
      break; }
    case 1: ctx.fillStyle='#e0c884'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#cdb26a'; ctx.fillRect(sx+h*20, sy+((h*7)%1)*24, 4, 3); break;
    case 2: { ctx.fillStyle = h>0.5?'#3f9e42':'#45a848'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#5cbf5e';
      ctx.fillRect(sx+4+h*16, sy+6+((h*13)%1)*18, 3, 5);
      ctx.fillRect(sx+18-h*10, sy+20-((h*7)%1)*10, 3, 5);
      break; }
    case 3: { ctx.fillStyle='#2c7a34'; ctx.fillRect(sx,sy,TILE,TILE);
      // 樹木
      const tx=sx+TILE/2, ty=sy+TILE/2;
      ctx.fillStyle='#5a3a1a'; ctx.fillRect(tx-2, ty+6, 5, 8);
      ctx.fillStyle='#1c5c24';
      ctx.beginPath(); ctx.moveTo(tx-11,ty+8); ctx.lineTo(tx+1,ty-12); ctx.lineTo(tx+13,ty+8); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#2e8038';
      ctx.beginPath(); ctx.moveTo(tx-8,ty+2); ctx.lineTo(tx+1,ty-13); ctx.lineTo(tx+10,ty+2); ctx.closePath(); ctx.fill();
      break; }
    case 4: { ctx.fillStyle='#4a8a4c'; ctx.fillRect(sx,sy,TILE,TILE);
      const mx=sx+TILE/2;
      ctx.fillStyle='#7d7a72';
      ctx.beginPath(); ctx.moveTo(sx+1,sy+TILE-2); ctx.lineTo(mx,sy+3); ctx.lineTo(sx+TILE-1,sy+TILE-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#a5a29a';
      ctx.beginPath(); ctx.moveTo(sx+7,sy+TILE-2); ctx.lineTo(mx,sy+8); ctx.lineTo(sx+TILE-8,sy+TILE-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#eeeef4';
      ctx.beginPath(); ctx.moveTo(mx-5,sy+12); ctx.lineTo(mx,sy+3); ctx.lineTo(mx+5,sy+12); ctx.closePath(); ctx.fill();
      break; }
    case 5: { ctx.fillStyle = h>0.5?'#4a3a66':'#52406e'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#6a548c'; ctx.fillRect(sx+4+h*16, sy+6+((h*13)%1)*18, 3, 5);
      if(h>0.8){ ctx.fillStyle='#2a2040'; // 枯樹
        ctx.fillRect(sx+14,sy+10,4,16); ctx.fillRect(sx+8,sy+12,16,3); }
      break; }
    case 6: { ctx.fillStyle='#45a848'; ctx.fillRect(sx,sy,TILE,TILE);
      // 小鎮（房屋）
      ctx.fillStyle='#c8b090'; ctx.fillRect(sx+5,sy+14,24,15);
      ctx.fillStyle='#a03028';
      ctx.beginPath(); ctx.moveTo(sx+2,sy+15); ctx.lineTo(sx+17,sy+3); ctx.lineTo(sx+32,sy+15); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#503020'; ctx.fillRect(sx+14,sy+20,7,9);
      ctx.fillStyle='#ffe082'; ctx.fillRect(sx+7,sy+17,5,5); ctx.fillRect(sx+23,sy+17,5,5);
      break; }
    case 7: { ctx.fillStyle='#52406e'; ctx.fillRect(sx,sy,TILE,TILE);
      // 魔王城
      ctx.fillStyle='#28203c'; ctx.fillRect(sx+4,sy+8,26,24);
      ctx.fillStyle='#3a3054';
      ctx.fillRect(sx+2,sy+4,7,28); ctx.fillRect(sx+25,sy+4,7,28); ctx.fillRect(sx+13,sy+1,8,31);
      ctx.fillStyle='#181028'; ctx.fillRect(sx+14,sy+20,6,12);
      const gl = 0.5+0.5*Math.sin(waterT*3);
      ctx.fillStyle=`rgba(255,40,80,${0.4+0.4*gl})`;
      ctx.fillRect(sx+4,sy+10,3,3); ctx.fillRect(sx+27,sy+10,3,3); ctx.fillRect(sx+16,sy+6,3,3);
      break; }
  }
}
function drawPlayer(sx, sy){
  const T2 = performance.now()/1000;
  const bob = player.moving ? Math.sin(player.step*0.5)*2 : 0;
  const x = sx+TILE/2;
  ctx.save();
  if(player.mode===2){ drawAirship(x, sy, T2); ctx.restore(); return; }
  if(player.mode===1){ drawRideBird(x, sy, bob, T2); ctx.restore(); return; }
  const y = sy+TILE/2+bob;
  // 影子
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, sy+TILE-3, 10, 4, 0, 0, 7); ctx.fill();
  // 身體（藍甲騎士）
  ctx.fillStyle='#2850c0'; ctx.fillRect(x-7, y-2, 14, 12);
  ctx.fillStyle='#4070e0'; ctx.fillRect(x-7, y-2, 14, 4);
  // 頭
  ctx.fillStyle='#f0c8a0'; ctx.fillRect(x-5, y-12, 10, 9);
  ctx.fillStyle='#3858c8'; ctx.fillRect(x-6, y-15, 12, 5); // 頭盔
  ctx.fillStyle='#ffe082'; ctx.fillRect(x-6, y-16, 12, 2);
  ctx.fillStyle='#000'; ctx.fillRect(x-3, y-9, 2, 2); ctx.fillRect(x+2, y-9, 2, 2);
  // 披風
  ctx.fillStyle='#a02838'; ctx.fillRect(x-9, y-1, 3, 10); ctx.fillRect(x+6, y-1, 3, 10);
  ctx.restore();
}
/* --- 路行鳥（黃色大鳥坐騎，原創設計） --- */
function drawRideBird(x, sy, bob, T2){
  const y = sy+TILE/2+bob;
  const run = player.moving ? Math.sin(player.step*0.9)*5 : 0;
  // 影子
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, sy+TILE-2, 13, 4.5, 0, 0, 7); ctx.fill();
  // 尾羽（三根）
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(x-8,y+2);
    ctx.quadraticCurveTo(x-18-i*3, y-4-i*4+Math.sin(T2*6+i)*2, x-14-i*3, y+6-i*2);
    ctx.quadraticCurveTo(x-11,y+6,x-8,y+4); ctx.closePath();
    ctx.fillStyle=i%2?'#e0a810':'#f4c520'; ctx.fill();
    ctx.strokeStyle='#8a6208'; ctx.lineWidth=1; ctx.stroke();
  }
  // 雙腳（奔跑擺動）
  ctx.strokeStyle='#e08818'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-4,y+8); ctx.lineTo(x-4+run,y+15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+4,y+8); ctx.lineTo(x+4-run,y+15); ctx.stroke();
  ctx.lineCap='butt';
  // 鳥身（渾圓）
  ctx.beginPath(); ctx.ellipse(x,y+2,11,9,0,0,7);
  ctx.fillStyle='#f4c520'; ctx.fill(); ctx.strokeStyle='#8a6208'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#ffdf6a'; ctx.beginPath(); ctx.ellipse(x-3,y,5,5.5,0,0,7); ctx.fill(); // 高光
  // 小翅膀
  ctx.beginPath(); ctx.ellipse(x+7,y+2,4.5,6,0.4,0,7);
  ctx.fillStyle='#e0a810'; ctx.fill(); ctx.strokeStyle='#8a6208'; ctx.lineWidth=1; ctx.stroke();
  // 鳥頭（長頸前伸）
  ctx.beginPath(); ctx.arc(x+9,y-10,6,0,7);
  ctx.fillStyle='#f4c520'; ctx.fill(); ctx.strokeStyle='#8a6208'; ctx.lineWidth=1.5; ctx.stroke();
  // 頭羽
  ctx.beginPath(); ctx.moveTo(x+6,y-15); ctx.quadraticCurveTo(x+4,y-21,x+9,y-18);
  ctx.quadraticCurveTo(x+9,y-22,x+12,y-17); ctx.closePath();
  ctx.fillStyle='#e0a810'; ctx.fill();
  // 橘色尖喙
  ctx.beginPath(); ctx.moveTo(x+14,y-11); ctx.lineTo(x+21,y-9); ctx.lineTo(x+14,y-7); ctx.closePath();
  ctx.fillStyle='#f08828'; ctx.fill(); ctx.strokeStyle='#a05a12'; ctx.lineWidth=1; ctx.stroke();
  // 圓眼
  ctx.fillStyle='#2a2010'; ctx.beginPath(); ctx.arc(x+10,y-11,1.8,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+9.4,y-11.6,0.7,0,7); ctx.fill();
  // 騎在背上的勇者（迷你）
  ctx.fillStyle='#2850c0'; ctx.fillRect(x-6,y-12,10,8);
  ctx.fillStyle='#a02838'; ctx.fillRect(x-8,y-11,3,7); // 披風
  ctx.fillStyle='#f0c8a0'; ctx.fillRect(x-5,y-19,8,7);
  ctx.fillStyle='#e9edf6'; ctx.fillRect(x-6,y-22,10,4); // 銀髮
  ctx.fillStyle='#000'; ctx.fillRect(x-3,y-17,1.5,2); ctx.fillRect(x,y-17,1.5,2);
}
/* --- 飛空艇（原創設計） --- */
function drawAirship(x, sy, T2){
  const alt = 16 + Math.sin(T2*2.2)*3; // 飛行高度浮動
  const y = sy+TILE/2-alt;
  // 地面投影
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x, sy+TILE-2, 17, 5, 0, 0, 7); ctx.fill();
  // 側翼
  ctx.beginPath(); ctx.moveTo(x-8,y+2); ctx.lineTo(x-26,y+7); ctx.lineTo(x-10,y+8); ctx.closePath();
  ctx.fillStyle='#8a5a2a'; ctx.fill(); ctx.strokeStyle='#4a2e12'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8,y+2); ctx.lineTo(x+26,y+7); ctx.lineTo(x+10,y+8); ctx.closePath();
  ctx.fillStyle='#7a4e22'; ctx.fill(); ctx.stroke();
  // 船身（木質流線）
  const hg=ctx.createLinearGradient(x,y-4,x,y+12);
  hg.addColorStop(0,'#c89050'); hg.addColorStop(0.5,'#a06830'); hg.addColorStop(1,'#6a4218');
  ctx.beginPath(); ctx.moveTo(x-20,y+2);
  ctx.quadraticCurveTo(x,y-6,x+22,y+1);   // 甲板線（船首朝右）
  ctx.quadraticCurveTo(x+15,y+12,x,y+12);
  ctx.quadraticCurveTo(x-16,y+12,x-20,y+2); ctx.closePath();
  ctx.fillStyle=hg; ctx.fill(); ctx.strokeStyle='#3a2410'; ctx.lineWidth=1.6; ctx.stroke();
  // 金色船首飾 + 龍骨線
  ctx.beginPath(); ctx.moveTo(x+22,y+1); ctx.lineTo(x+28,y-2); ctx.lineTo(x+23,y+4); ctx.closePath();
  ctx.fillStyle='#ffd257'; ctx.fill(); ctx.strokeStyle='#8a6a10'; ctx.lineWidth=1; ctx.stroke();
  ctx.strokeStyle='rgba(255,220,140,0.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x-17,y+5); ctx.quadraticCurveTo(x,y+1,x+19,y+4); ctx.stroke();
  // 小船艙
  ctx.fillStyle='#8a5a2a'; ctx.fillRect(x-6,y-6,12,7);
  ctx.strokeStyle='#3a2410'; ctx.lineWidth=1.2; ctx.strokeRect(x-6,y-6,12,7);
  ctx.fillStyle='#ffe082'; ctx.fillRect(x-3,y-4,3,3); // 窗燈
  // 尾舵

let dialogQueue = [], dialogResolve = null;
function showDialog(lines){
  return new Promise(res=>{
    dialogQueue = Array.isArray(lines)?lines.slice():[lines];
    dialogResolve = res;
    nextDialog(true);
  });
}
function nextDialog(first){
  if(!first) Snd.sfx('confirm');
  if(dialogQueue.length===0){
    $('dialog').style.display='none';
    const r=dialogResolve; dialogResolve=null;
    if(r) r();
    return;
  }
  $('dialogtext').innerHTML = dialogQueue.shift();
  $('dialog').style.display='block';
}

function makeMenu(el, items, onPick, onCancel, titleHTML){
  // items: {label, dim, small, value}
  let sel = 0;
  const render = ()=>{
    let html = titleHTML||'';
    items.forEach((it,i)=>{
      html += `<div class="menuitem ${i===sel?'sel':''} ${it.dim?'dim':''}" data-i="${i}">${it.label}${it.small?` <small>${it.small}</small>`:''}</div>`;
    });
    el.innerHTML = html;
    el.querySelectorAll('.menuitem').forEach(n=>{
      n.onmouseenter = ()=>{ sel=+n.dataset.i; render(); };
      n.onclick = (e)=>{ e.stopPropagation(); sel=+n.dataset.i; pick(); };
    });
  };
  const pick = ()=>{
    const it = items[sel];
    if(it.dim){ Snd.sfx('cancel'); return; }
    Snd.sfx('confirm'); onPick(it.value!==undefined?it.value:sel, sel);
  };
  const handler = {
    key(e){
      if(e.key==='ArrowUp'){ sel=(sel-1+items.length)%items.length; Snd.sfx('cursor'); render(); }
      else if(e.key==='ArrowDown'){ sel=(sel+1)%items.length; Snd.sfx('cursor'); render(); }
      else if(e.key==='Enter'||e.key===' '){ pick(); }
      else if(e.key==='Escape'){ if(onCancel){ Snd.sfx('cancel'); onCancel(); } }
    }
  };
  render(); el.style.display='block';
  return handler;
}

/* ============================ 地圖移動 ============================ */
let moveCd = 0;
function updateField(dt){
  moveCd -= dt;
  if(dialogResolve || activeMenuHandler) return;
  if(moveCd>0) return;
  let dx=0, dy=0;
  if(keys['ArrowUp']||keys['w']) dy=-1;
  else if(keys['ArrowDown']||keys['s']) dy=1;
  else if(keys['ArrowLeft']||keys['a']) dx=-1;
  else if(keys['ArrowRight']||keys['d']) dx=1;
  player.moving = (dx||dy);
  if(!dx&&!dy) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(player.mode===2){
    // 飛空艇：可飛越一切，只受地圖邊界限制
    if(nx<0||ny<0||nx>=MW||ny>=MH){ moveCd=0.05; return; }
  } else if(!walkable(nx,ny)){ moveCd=0.1; return; }
  player.x=nx; player.y=ny; player.step++;
  moveCd = player.mode===2?0.055 : player.mode===1?0.085 : 0.14;
  const t = map[ny][nx];
  if(player.mode!==2){
    if(t===6){ player.mode=0; enterTown(); return; }   // 路行鳥在鎮外等候
    if(t===7){ player.mode=0; enterCastle(); return; }
  }
  stepsSinceBattle++;
  // 騎乘路行鳥或搭飛空艇時不會遭遇敵人
  if(player.mode===0 && stepsSinceBattle>4 && (t===2||t===3||t===5)){
    const rate = t===5?0.20:0.13;
    if(Math.random()<rate){
      stepsSinceBattle=0;
      const pool = t===2?GROUPS.grass : t===3?GROUPS.forest : GROUPS.dark;
      startBattle(pool[ri(0,pool.length-1)], t);
    }
  }
}

    '你們踏入了魔王城的大門——空氣冰冷刺骨，紫黑色的霧氣在石柱間流動……',
    '王座之上，一副漆黑鑲金的鎧甲緩緩站起，頭盔的細縫中透出血紅的目光。',
    '<b>諾克斯</b>：「渺小的人類……竟敢踏入朕的深淵。」',
    '<b>諾克斯</b>：「就讓你們見識，吞噬水晶之光的<b>真正黑暗</b>吧！！」'
  ]);

}

/* ============================ 戰鬥系統 ============================ */
const battle = {
  active:false, enemies:[], busy:false, readyQueue:[], curHero:null,
  particles:[], fx:[], shake:{t:0,mag:0}, cine:null, terrain:2, flashWhite:0,
  turnCount:0, bossPhase:1, bossCharging:false, introT:0
};
function mkEnemy(id, i, n){
  const d = MONSTERS[id];
  const e = { id, name:d.name, hp:d.hp, maxhp:d.hp, atk:d.atk, def:d.def, mag:d.mag,
    spd:d.spd, exp:d.exp, gil:d.gil, draw:d.draw, ai:d.ai, weak:d.weak, resist:d.resist,
    boss:d.boss, noInstakill:d.noInstakill, resistAll:d.resistAll,
    atb:rand(0,40), alive:true, flash:0, sx:0, sy:0, status:{} };
  if(d.boss){ e.sx=250; e.sy=280; }
  else { e.sx = 200 + (i%2)*90; e.sy = 150 + i*110 - (n>2?40:0); }
  // 同名編號
  return e;
}
function startBattle(group, terrain){
  state='battle';
  battle.active=true; battle.enemies = group.map((id,i)=>mkEnemy(id,i,group.length));
  // 同名怪物加上 A/B/C
  const nameCount={};
  battle.enemies.forEach(e=>{ nameCount[e.name]=(nameCount[e.name]||0)+1; });
  const seen={};
  battle.enemies.forEach(e=>{ if(nameCount[e.name]>1){ seen[e.name]=(seen[e.name]||0); e.name += ' '+String.fromCharCode(65+seen[e.name]++); } });
  battle.busy=false; battle.readyQueue=[]; battle.curHero=null;
  battle.particles=[]; battle.fx=[]; battle.cine=null; battle.terrain=terrain;
  battle.turnCount=0; battle.bossPhase=1; battle.bossCharging=false;
  battle.introT = 2.2; // 戰鬥開場立繪演出時間
  party.forEach(h=>{ h.atb=rand(0,60); h.defending=false; h.status={}; });
  const isBoss = battle.enemies.some(e=>e.boss);
  Snd.playSong(isBoss?SONG_BOSS:SONG_BATTLE);
  Snd.sfx('confirm');
  $('statwin').style.display='block';
  $('hudhint').style.display='none';
  battleMsg(isBoss? '⚡ 冥暗魔皇・諾克斯 擋在面前！' : `${battle.enemies.map(e=>e.name).join('、')} 出現了！`);
  renderStatWin();
}
function battleMsg(txt){
  const el=$('msglog'); el.innerHTML=txt; el.style.display='block';
}
function renderStatWin(){
  let html='<table>';
  for(const h of party){
    const hpc = h.hp<=0?'hpdead':(h.hp<h.maxhp*0.3?'hplow':'hpok');
    const st = h.status.stone? '🗿' : h.status.para? '⚡' : '';
    html += `<tr><td><b style="color:${h.color}">${h.name}</b>${st}</td>
      <td class="${hpc}">HP ${h.hp}/${h.maxhp}</td>
      <td style="color:#a0c0ff">MP ${h.mp}</td>
      <td><div class="atbbar"><div style="width:${clamp(h.atb,0,100)}%"></div></div></td></tr>`;
  }
  html+='</table>';
  $('statwin').innerHTML = html;
}
function popDmg(x, y, txt, color){
  const el = document.createElement('div');
  el.className='dmgpop'; el.textContent=txt;
  el.style.left=(x-20)+'px'; el.style.top=(y-20)+'px'; el.style.color=color||'#fff';
  el.style.pointerEvents='none';
  $('overlayui').appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}
function addParticles(x,y,n,color,spread=4,grav=0.1,size=4,opt){
  opt=opt||{};
  for(let i=0;i<n;i++) battle.particles.push({
    x:x+(opt.jitter?rand(-opt.jitter,opt.jitter):0), y:y+(opt.jitter?rand(-opt.jitter,opt.jitter):0),
    vx:rand(-spread,spread)+(opt.vx||0), vy:rand(-spread,spread)-1+(opt.vy||0),
    life:rand(0.4,0.9)*(opt.lifeK||1), maxlife:0.9*(opt.lifeK||1),
    color, size:rand(size*0.5,size*1.4), grav,
    glow:opt.glow, spark:opt.spark, rot:opt.spark?rand(0,7):0 });
}
function shake(mag, t=0.4){ battle.shake.mag=mag; battle.shake.t=t; }

/* --- 戰鬥更新（ATB） --- */
function updateBattle(dt){
  // 粒子
  battle.particles = battle.particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.life-=dt; if(p.spark) p.rot+=0.3; return p.life>0;
  });
  battle.fx = battle.fx.filter(f=>{ f.t+=dt; return f.t<f.dur; });
  if(battle.shake.t>0) battle.shake.t-=dt;
  if(battle.flashWhite>0) battle.flashWhite-=dt*2;
  battle.enemies.forEach(e=>{ if(e.flash>0) e.flash-=dt; });
  if(!battle.active) return; // 戰鬥已結束：停止 ATB，避免選單在結算後彈出
  if(battle.introT>0){ battle.introT-=dt; return; } // 開場立繪演出期間暫停 ATB
  if(battle.busy || battle.cine || dialogResolve) return;
  if(battle.curHero) return; // 等待模式：選單開啟時間停止
  // ATB 增量（速度越高充填越快）
  for(const e of battle.enemies){ if(e.alive) e.atb = clamp(e.atb + e.spd*dt*0.55, 0, 100); }
  for(const h of party){ if(h.hp>0) h.atb = clamp(h.atb + h.spd*dt*0.55, 0, 100); }
  renderStatWin();
  // 敵人行動
  for(const e of battle.enemies){
    if(e.alive && e.atb>=100){ e.atb=0; enemyAct(e); return; }
  }
  // 我方行動
  for(const h of party){
    if(h.hp>0 && h.atb>=100 && !battle.readyQueue.includes(h)) battle.readyQueue.push(h);
  }
  if(battle.readyQueue.length>0 && !battle.curHero){
    const h = battle.readyQueue.shift();
    if(h.hp>0){
      if(h.status.stone||h.status.para){
        // 狀態異常：跳過回合
        const key = h.status.stone?'stone':'para';
        h.status[key]--; if(h.status[key]<=0) delete h.status[key];
        h.atb=0;
        battleMsg(`${h.name} ${key==='stone'?'被石化了，無法行動！':'麻痺中，無法行動！'}`);
        return;
      }
      battle.curHero = h;
      openCommandMenu(h);
    }
  }
}

/* --- 指令選單 --- */
function openCommandMenu(h){
  const el = $('cmdwin');
  const cmds = [{label:'⚔ 攻擊', value:'attack'}];
  if(knownSpells(h).length) cmds.push({label:'✦ 魔法', value:'magic'});
  if(knownSummons(h).length) cmds.push({label:'🐉 召喚', value:'summon'});
  cmds.push({label:'🎒 道具', value:'item'});
  cmds.push({label:'🛡 防禦', value:'defend'});
  if(!battle.enemies.some(e=>e.boss)) cmds.push({label:'👟 逃跑', value:'run'});
  activeMenuHandler = makeMenu(el, cmds, async v=>{
    if(v==='attack') pickEnemyTarget(t=>doAttack(h,t), ()=>openCommandMenu(h));
    else if(v==='magic') magicMenu(h);
    else if(v==='summon') summonMenu(h);
    else if(v==='item') battleItemMenu(h);
    else if(v==='defend'){ closeBattleMenus(); h.defending=true; h.atb=0; endHeroTurn(); battleMsg(`${h.name} 擺出了防禦姿態。`); }
    else if(v==='run'){
      closeBattleMenus();
      if(Math.random()<0.7){ battleMsg('成功逃走了！'); await sleep(700); endBattle(false); }
      else { battleMsg('逃跑失敗！'); h.atb=0; endHeroTurn(); }
    }
  }, null, `<div class="title">${h.name}</div>`);
}
function closeBattleMenus(){
  $('cmdwin').style.display='none'; $('subwin').style.display='none';
  activeMenuHandler=null;
}
function endHeroTurn(){
  battle.curHero=null;
  closeBattleMenus();
}
function pickEnemyTarget(cb, back){
  const alive = battle.enemies.filter(e=>e.alive);
  if(alive.length===1){ closeBattleMenus(); cb(alive[0]); return; }
  const el=$('subwin');
  const items = alive.map(e=>({label:e.name, small:e.boss?'':`HP ${e.hp}/${e.maxhp}`, value:e}));
  activeMenuHandler = makeMenu(el, items, v=>{ closeBattleMenus(); cb(v); }, back, `<div class="title">選擇目標</div>`);
}
function pickAllyTarget(cb, back, forRevive){
  const el=$('subwin');
  const items = party.map(h=>({label:h.name, small:`HP ${h.hp}/${h.maxhp} MP ${h.mp}`, value:h,
    dim: forRevive? h.hp>0 : h.hp<=0}));
  activeMenuHandler = makeMenu(el, items, v=>{ $('subwin').style.display='none'; cb(v); }, back, `<div class="title">選擇隊友</div>`);
}
function magicMenu(h){
  const el=$('subwin');
  const items = knownSpells(h).map(id=>{
    const s=SPELLS[id];
    return {label:`${s.name} <small style="color:#88a">${s.tier}</small>`, small:`MP ${s.mp}${s.all?'｜全體':''}`, value:id, dim:h.mp<s.mp};
  });
  activeMenuHandler = makeMenu(el, items, id=>{
    const s = SPELLS[id];
    if(s.ally){
      if(s.all){ closeBattleMenus(); doSpell(h,id,null); }
      else pickAllyTarget(t=>{ closeBattleMenus(); doSpell(h,id,t); }, ()=>magicMenu(h), !!s.revive);
    } else {
      if(s.all){ closeBattleMenus(); doSpell(h,id,null); }
      else pickEnemyTarget(t=>doSpell(h,id,t), ()=>magicMenu(h));
    }
  }, ()=>openCommandMenu(h), `<div class="title">魔法</div>`);
}
function summonMenu(h){
  const el=$('subwin');
  const items = knownSummons(h).map(id=>{
    const s=SUMMONS[id];
    return {label:`${s.name}`, small:`${s.move}｜MP ${s.mp}｜全體`, value:id, dim:h.mp<s.mp};
  });
  activeMenuHandler = makeMenu(el, items, id=>{ closeBattleMenus(); doSummon(h,id); },
    ()=>openCommandMenu(h), `<div class="title">召喚</div>`);
}
function battleItemMenu(h){
  const el=$('subwin');
  const items = Object.entries(inv.items).filter(([id,n])=>n>0)
    .map(([id,n])=>({label:`${ITEMS[id].name} ×${n}`, small:ITEMS[id].desc, value:id}));
  if(items.length===0) items.push({label:'（沒有道具）', dim:true});
  activeMenuHandler = makeMenu(el, items, id=>{
    const it=ITEMS[id];
    if(it.party){ closeBattleMenus(); doItem(h,id,null); }
    else pickAllyTarget(t=>{ closeBattleMenus(); doItem(h,id,t); }, ()=>battleItemMenu(h), !!it.revive);
  }, ()=>openCommandMenu(h), `<div class="title">道具</div>`);
}

/* --- 傷害計算 --- */
function elemMult(e, elem){
  if(!elem||elem==='none') return e.resistAll||1;
  let m = 1;
  if(e.weak===elem) m=1.8;
  else if(e.resist===elem) m=0.4;
  if(e.resistAll && e.weak!==elem) m*=e.resistAll;
  return m;
}
function physDmg(atk, def, defending){
  let d = Math.max(1, atk*3 - def*1.5);
  d *= rand(0.9,1.1);
  if(defending) d*=0.5;
  return Math.floor(d);
}
function magDmg(pow, mag, def, mult){
  let d = pow*(1+mag/24)*mult - def*0.8;
  return Math.floor(Math.max(1, d*rand(0.92,1.08)));
}
function enemyScreenPos(e){ return {x:e.sx+40, y:e.sy+35}; }
function heroScreenPos(i){ return {x:720, y:170+i*95}; }

/* --- 我方行動 --- */
async function doAttack(h, t){
  battle.busy=true; endHeroTurn(); h.atb=0; h.defending=false;
  battleMsg(`${h.name} 的攻擊！`);
  await sleep(250);
  const crit = Math.random()<0.1;
  let dmg = physDmg(heroAtk(h), t.def, false);
  if(crit) dmg = Math.floor(dmg*1.8);
  Snd.sfx(crit?'crit':'hit');
  t.flash=0.25;
  const p = enemyScreenPos(t);
  addParticles(p.x,p.y,14,'#fff',5,0.15);
  if(crit) shake(6,0.25);
  applyDmgToEnemy(t, dmg, crit?'#ffe082':'#fff', crit?'會心一擊！':null);
  await sleep(500);
  battle.busy=false;
  checkBattleEnd();
}
async function doSpell(h, id, t){
  const s = SPELLS[id];
  battle.busy=true; endHeroTurn(); h.atb=0; h.defending=false; h.mp-=s.mp;
  battleMsg(`${h.name} 詠唱 ${s.name}（${s.tier}）！`);
  // 施法光圈
  const hp0 = heroScreenPos(h.idx);
  addParticles(hp0.x, hp0.y, 20, s.color, 3, -0.05, 3);
  await sleep(450);
  if(s.ally){
    Snd.sfx('heal');
    const targets = s.all? party.filter(x=>x.hp>0) : [t];
    for(const tg of targets){
      const pp = heroScreenPos(tg.idx);
      addParticles(pp.x,pp.y,18,s.color,3,-0.08);
      if(s.revive){ if(tg.hp<=0){ tg.hp=Math.floor(tg.maxhp/2); popDmg(pp.x,pp.y,'復活！','#ffd0ff'); } }
      else { const amt=s.heal; tg.hp=clamp(tg.hp+amt,0,tg.maxhp); popDmg(pp.x,pp.y,amt,'#80ffb0'); }
    }
  } else {
    Snd.sfx(s.elem==='fire'?'fire':s.elem==='ice'?'ice':s.elem==='thunder'?'thunder':'fire');
    const targets = s.all? battle.enemies.filter(e=>e.alive) : [t];
    if(s.elem==='thunder') battle.flashWhite = 0.6;
    for(const e of targets){
      const p = enemyScreenPos(e);
      spellVisual(s.elem, p.x, p.y, s.color);
      const dmg = magDmg(s.pow, heroMag(h), e.def, elemMult(e, s.elem));
      e.flash=0.3;
      applyDmgToEnemy(e, dmg, s.color, e.weak===s.elem?'弱點！':null);
    }
    if(s.all) shake(5,0.3);
  }
  await sleep(650);
  battle.busy=false;
  checkBattleEnd();
}
function addFx(fx){ fx.t=0; fx.dur=fx.dur||0.5; battle.fx.push(fx); }
function spellVisual(elem, x, y, color){
  if(elem==='fire'){
    // 上升火焰柱 + 爆燃火球 + 火花
    addParticles(x,y+18,34,'#ff6a10',3.5,-0.28,8,{glow:true,jitter:14,lifeK:0.9});
    addParticles(x,y,22,'#ffd050',3,-0.32,6,{glow:true,jitter:10});
    addParticles(x,y-6,14,'#fff2c0',2,-0.36,4,{glow:true});
    addParticles(x,y+14,16,'#ff9030',5,0.05,3,{spark:true});
    addFx({type:'ring',x,y,r0:8,r1:70,col:'255,140,40',dur:0.4});
    addFx({type:'flash',x,y,r:80,col:'255,180,90',dur:0.22});
  } else if(elem==='ice'){
    // 凝結冰晶 + 碎裂
    addFx({type:'shards',x,y,col:'190,235,255',dur:0.55});
    addParticles(x,y-16,26,'#bfeeff',3,0.35,5,{glow:true,jitter:16});
    addParticles(x,y,16,'#ffffff',2.5,0.3,3,{glow:true});
    addParticles(x,y,20,'#88c8ff',4,0.28,3,{spark:true});
    addFx({type:'ring',x,y,r0:4,r1:58,col:'160,220,255',dur:0.45});
  } else if(elem==='thunder'){
    // 天降雷擊 + 電花
    addFx({type:'bolt',x,y,col:'255,248,150',dur:0.28});
    addFx({type:'flash',x,y,r:100,col:'255,255,200',dur:0.18});
    addParticles(x,y,30,'#fff7a0',6,0.1,4,{glow:true,jitter:8});
    addParticles(x,y,18,'#ffffff',7,0.05,3,{spark:true});
  } else if(elem==='holy'){
    // 神聖光柱 + 光環
    addFx({type:'pillar',x,y,col:'255,250,220',dur:0.5});
    addFx({type:'ring',x,y,r0:6,r1:76,col:'255,240,180',dur:0.5});
    addParticles(x,y,40,'#ffffff',3,-0.14,5,{glow:true,jitter:12});
    addParticles(x,y,20,'#ffe6a0',2.5,-0.18,4,{glow:true});
  } else {
    addFx({type:'ring',x,y,r0:6,r1:64,col:'220,200,255',dur:0.4});
    addParticles(x,y,30,color||'#e0c0ff',5,0,5,{glow:true,jitter:10});
  }
}
/* --- 短生命繪製特效（環、雷、冰晶、光柱） --- */
function drawFx(){
  for(const f of battle.fx){
    const p = clamp(f.t/f.dur,0,1);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    if(f.type==='ring'){
      const r=f.r0+(f.r1-f.r0)*p;
      ctx.globalAlpha=(1-p)*0.9; ctx.strokeStyle=`rgba(${f.col},1)`; ctx.lineWidth=6*(1-p)+1.5;
      ctx.beginPath(); ctx.arc(f.x,f.y,r,0,7); ctx.stroke();
    } else if(f.type==='flash'){
      ctx.globalAlpha=(1-p); const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      g.addColorStop(0,`rgba(${f.col},0.9)`); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill();
    } else if(f.type==='bolt'){
      ctx.globalAlpha=p<0.5?1:(1-p)*2; ctx.strokeStyle=`rgba(${f.col},1)`;
      ctx.lineWidth=4; ctx.shadowColor=`rgba(${f.col},1)`; ctx.shadowBlur=14;
      ctx.beginPath(); let yy=-20, xx=f.x; ctx.moveTo(xx,yy);
      while(yy<f.y){ xx=f.x+ (hash2(Math.floor(yy/24),f.x)-0.5)*46; yy+=24; ctx.lineTo(xx,yy); }
      ctx.lineTo(f.x,f.y); ctx.stroke();
      ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.stroke();
    } else if(f.type==='pillar'){
      ctx.globalAlpha=(1-p)*0.85; const g=ctx.createLinearGradient(f.x,f.y-160,f.x,f.y+20);
      g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(${f.col},0.9)`);
      ctx.fillStyle=g; const w=(26+Math.sin(f.t*40)*5)*(1-p*0.4);
      ctx.beginPath(); ctx.moveTo(f.x-w,f.y+16); ctx.lineTo(f.x-w*0.5,f.y-160); ctx.lineTo(f.x+w*0.5,f.y-160); ctx.lineTo(f.x+w,f.y+16); ctx.closePath(); ctx.fill();
    } else if(f.type==='shards'){
      ctx.globalAlpha=1-p; ctx.strokeStyle=`rgba(${f.col},1)`; ctx.lineWidth=2.5;
      for(let i=0;i<6;i++){ const a=i/6*7+f.x; const r=10+p*44; const cx=f.x+Math.cos(a)*r, cy=f.y+Math.sin(a)*r;
        ctx.beginPath(); ctx.moveTo(cx-4,cy+6); ctx.lineTo(cx,cy-8); ctx.lineTo(cx+4,cy+6); ctx.stroke(); }
    } else if(f.type==='slash'){
      ctx.globalAlpha=p<0.4?1:(1-p)/0.6; ctx.strokeStyle=`rgba(${f.col},1)`; ctx.lineWidth=5*(1-p)+1;
      ctx.shadowColor=`rgba(${f.col},1)`; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.moveTo(f.x-60,f.y-46); ctx.lineTo(f.x+60,f.y+46); ctx.stroke();
    }
    ctx.restore();
  }
}
function applyDmgToEnemy(e, dmg, color, extraTxt){
  e.hp -= dmg;
  const p = enemyScreenPos(e);
  popDmg(p.x, p.y, dmg, color);
  if(extraTxt) popDmg(p.x, p.y-35, extraTxt, '#ffe082');
  if(e.hp<=0){ e.hp=0; e.alive=false; Snd.sfx('die'); addParticles(p.x,p.y,30,'#8060ff',5,0.05); }
  // 魔王階段轉換
  if(e.boss && e.alive && battle.bossPhase===1 && e.hp < e.maxhp*0.5){
    battle.bossPhase=2;
    (async()=>{ await sleep(300);
      battleMsg('<b style="color:#ff6080">諾克斯：「有點意思……但真正的絕望，現在才要開始！！」</b>');
      shake(8,0.6); Snd.sfx('warn');
      e.atk=Math.floor(e.atk*1.15); e.spd+=8;
    })();
  }
}

/* --- 召喚演出 --- */
async function doSummon(h, id){
  const s = SUMMONS[id];
  battle.busy=true; endHeroTurn(); h.atb=0; h.defending=false; h.mp-=s.mp;
  battleMsg(`${h.name} 開始召喚——`);
  Snd.sfx('summon');
  battle.cine = {type:s.cine, t:0};
  // 演出時間軸
  const dur = (id==='bahamut')?4.2 : (id==='odin')?3.2 : 2.6;
  const start = performance.now();
  while(performance.now()-start < dur*1000){
    battle.cine.t = (performance.now()-start)/1000;
    await sleep(16);
  }
  battle.cine=null;
  battleMsg(`✨ ${s.name}——「${s.move}」！！`);
  if(id==='bahamut'){
    Snd.sfx('megaflare'); shake(16,1.0); battle.flashWhite=1.3;
    // 百萬核爆：全螢幕能量衝擊
    for(let r=0;r<3;r++) addFx({type:'ring',x:W/2,y:H/2-40,r0:20+r*30,r1:520,col:r%2?'180,130,255':'255,240,255',dur:0.7+r*0.15});
    addFx({type:'flash',x:W/2,y:H/2-40,r:520,col:'200,170,255',dur:0.5});
  }
  else if(id==='odin'){ Snd.sfx('zantetsu'); shake(10,0.5); battle.flashWhite=0.85; }
  else { Snd.sfx(s.elem==='fire'?'fire':s.elem==='ice'?'ice':'thunder'); shake(8,0.5); }
  const targets = battle.enemies.filter(e=>e.alive);
  for(const e of targets){
    const p = enemyScreenPos(e);
    if(s.instakill && !e.noInstakill && Math.random()<s.instakill){
      addFx({type:'slash',x:p.x,y:p.y,col:'255,255,255',dur:0.35});
      e.hp=0; e.alive=false; Snd.sfx('die');
      popDmg(p.x,p.y,'一刀兩斷！','#fff');
      addParticles(p.x,p.y,40,'#ffffff',7,0.06,5,{glow:true});
      addParticles(p.x,p.y,20,'#a0c0ff',6,0.05,3,{spark:true});
      continue;
    }
    if(s.instakill && e.noInstakill){ addFx({type:'slash',x:p.x,y:p.y,col:'160,180,255',dur:0.35}); popDmg(p.x,p.y-35,'斬鐵劍無法斬斷！','#a0b0ff'); }
    if(id==='bahamut'){
      // 對每個敵人再加一發核爆衝擊
      addFx({type:'ring',x:p.x,y:p.y,r0:8,r1:100,col:'200,170,255',dur:0.5});
      addParticles(p.x,p.y,44,'#e8d0ff',6,0.02,7,{glow:true,jitter:18});
      addParticles(p.x,p.y,24,'#ffffff',5,0,4,{glow:true});
    } else if(!s.instakill){
      spellVisual(s.elem==='none'?'holy':s.elem, p.x, p.y, '#fff');
    }
    const dmg = magDmg(s.pow, heroMag(h), e.def, elemMult(e, s.elem));
    e.flash=0.4;
    applyDmgToEnemy(e, dmg, '#ffe082', e.weak===s.elem?'弱點！':null);
  }
  await sleep(800);
  battle.busy=false;
  checkBattleEnd();
}

/* --- 敵人 AI --- */
async function enemyAct(e){
  battle.busy=true;
  const alive = party.filter(h=>h.hp>0);
  if(alive.length===0){ battle.busy=false; return; }
  const target = alive[ri(0,alive.length-1)];
  const p0 = enemyScreenPos(e);

  const doPhys = async (mult=1, name=null)=>{
    battleMsg(name? `${e.name} 使出 ${name}！` : `${e.name} 的攻擊！`);
    await sleep(350);
    Snd.sfx('hit');
    const dmg = Math.floor(physDmg(e.atk, heroDef(target), target.defending)*mult);
    hurtHero(target, dmg);
    await sleep(450);
  };
  const doAllPhys = async (mult, name)=>{
    battleMsg(`${e.name} 使出 ${name}！`); await sleep(400);
    Snd.sfx('crit'); shake(7,0.4);
    for(const h of alive){
      const dmg = Math.floor(physDmg(e.atk, heroDef(h), h.defending)*mult);
      hurtHero(h, dmg);
    }
    await sleep(500);
  };
  const doMag = async (pow, elem, name, allTarget)=>{
    battleMsg(`${e.name} 詠唱 ${name}！`); await sleep(400);
    Snd.sfx(elem==='fire'?'fire':elem==='ice'?'ice':elem==='thunder'?'thunder':'fire');
    const tgts = allTarget? alive : [target];
    if(allTarget) shake(6,0.4);
    for(const h of tgts){
      const pp = heroScreenPos(h.idx);
      spellVisual(elem, pp.x, pp.y);
      let dmg = magDmg(pow, e.mag, heroDef(h)*0.6, 1);
      if(h.defending) dmg=Math.floor(dmg*0.5);
      hurtHero(h, dmg);
    }
    await sleep(500);
  };

  switch(e.ai){
    case 'bomb':
      if(e.hp < e.maxhp*0.35){
        battleMsg(`${e.name} 開始劇烈膨脹——自爆了！！`);
        await sleep(600); Snd.sfx('crit'); shake(8,0.5);
        addParticles(p0.x,p0.y,45,'#ff8030',7,-0.05,7);
        const dmg = Math.floor(e.hp*1.6);
        e.hp=0; e.alive=false;
        hurtHero(target, dmg);
        await sleep(500);
      } else await doPhys();
      break;
    case 'petrify':
      if(Math.random()<0.3 && !target.status.stone){
        battleMsg(`${e.name} 射出了石化之光！`); await sleep(400);
        Snd.sfx('ice');
        target.status.stone = 2;
        const pp=heroScreenPos(target.idx);
        addParticles(pp.x,pp.y,15,'#b0a890',3,0.1);
        popDmg(pp.x,pp.y,'石化！','#d0c8b0');
        await sleep(500);
      } else await doPhys();
      break;
    case 'blaster':
      if(Math.random()<0.4){
        battleMsg(`${e.name} 鬍鬚一顫——波動砲！`); await sleep(450);
        Snd.sfx('thunder');
        if(Math.random()<0.5 && !target.status.para){
          target.status.para=2;
          const pp=heroScreenPos(target.idx);
          popDmg(pp.x,pp.y,'麻痺！','#ffe082');
        } else hurtHero(target, 80);
        await sleep(500);
      } else await doPhys();
      break;
    case 'behemoth':
      if(Math.random()<0.35) await doAllPhys(0.8,'狂暴踐踏');
      else await doPhys(1.2);
      break;
    case 'boss': await bossAct(e, alive, doPhys, doAllPhys, doMag); break;
    default: await doPhys();
  }
  battle.busy=false;
  renderStatWin();
  checkDefeat();
  checkBattleEnd();
}
async function bossAct(e, alive, doPhys, doAllPhys, doMag){
  battle.turnCount++;
  const t = battle.turnCount;
  // 蓄力後的滅世爆裂
  if(battle.bossCharging){
    battle.bossCharging=false;
    battleMsg('<b style="color:#ff4060">諾克斯——「滅世爆裂」！！！</b>');
    await sleep(600);
    Snd.sfx('megaflare'); shake(14,1.0); battle.flashWhite=1.2;
    for(const h of alive){
      const pp=heroScreenPos(h.idx);
      addParticles(pp.x,pp.y,30,'#ff5080',6,0,6);
      let dmg = magDmg(95, e.mag, heroDef(h)*0.5, 1);
      if(h.defending) dmg=Math.floor(dmg*0.5);
      hurtHero(h, dmg);
    }
    await sleep(600);
    return;
  }
  if(t===1){ // 開場：束縛寒冰
    battleMsg('諾克斯 展開了「束縛寒冰」！刺骨的冷氣籠罩全隊——');
    await sleep(500); Snd.sfx('ice');
    for(const h of alive){
      if(Math.random()<0.55){ h.status.para=2;
        const pp=heroScreenPos(h.idx); popDmg(pp.x,pp.y,'麻痺！','#a0e0ff');
        addParticles(pp.x,pp.y,12,'#a0e0ff',3,0.1);
      }
    }
    await sleep(600);
    return;
  }
  if(battle.bossPhase===2){
    // 第二階段：每 3 回合蓄力大招
    if(t%3===0){
      battle.bossCharging=true;
      battleMsg('<b style="color:#ff8080">⚠ 諾克斯的周身開始劇烈震動——巨大的黑暗能量正在匯聚！！</b>');
      Snd.sfx('warn');
      addParticles(e.sx+90, e.sy+80, 40, '#ff3060', 3, -0.15, 5);
      await sleep(800);
      return;
    }
    if(e.hp < e.maxhp*0.22 && Math.random()<0.5){
      await doMag(120,'none','隕石──Meteor！', true);
      return;
    }
    const r = Math.random();
    if(r<0.35) await doMag(70,'fire','爆炎術', false);
    else if(r<0.6) await doMag(60,'thunder','霹靂術', true);
    else await doPhys(1.35,'暗黑劍・深淵斬');
  } else {
    const r = Math.random();
    if(r<0.3) await doMag(55,'ice','寒冰術', false);
    else if(r<0.5) await doMag(50,'thunder','雷鳴術', false);
    else if(r<0.7) await doAllPhys(0.7,'黑暗波動');
    else await doPhys(1.2,'暗黑劍');
  }
}
function hurtHero(h, dmg){
  if(h.defending) {} // 已在計算內
  h.hp = Math.max(0, h.hp-dmg);
  const pp = heroScreenPos(h.idx);
  popDmg(pp.x, pp.y, dmg, '#ff9090');
  addParticles(pp.x,pp.y,10,'#ff6060',4,0.15);
  if(h.hp<=0){ Snd.sfx('die'); popDmg(pp.x,pp.y-35,'倒下了！','#ff6060');
    if(battle.curHero===h){ endHeroTurn(); } // 若正在選指令的人倒下
    const qi = battle.readyQueue.indexOf(h); if(qi>=0) battle.readyQueue.splice(qi,1);
  }
  renderStatWin();
}
function checkDefeat(){
  if(party.every(h=>h.hp<=0)) gameOver();
}
function checkBattleEnd(){
  if(!battle.active) return;
  if(party.every(h=>h.hp<=0)){ gameOver(); return; }
  if(battle.enemies.every(e=>!e.alive)) victory();
}
async function victory(){
  if(!battle.active) return;
  battle.active=false;
  const isBoss = battle.enemies.some(e=>e.boss);
  battle.curHero=null; battle.readyQueue=[];
  closeBattleMenus();
  playVictory();
  const exp = battle.enemies.reduce((s,e)=>s+e.exp,0);
  const gil = battle.enemies.reduce((s,e)=>s+e.gil,0);
  inv.gil += gil;
  const msgs = [];
  gainExp(exp, msgs);
  if(msgs.length) Snd.sfx('levelup');
  battleMsg('🏆 戰鬥勝利！');
  await sleep(900);
  const lines = [`戰鬥勝利！獲得 <b>${exp} EXP</b>、<span class="goldtxt">${gil} Gil</span>！`];
  for(let i=0;i<msgs.length;i+=3) lines.push(msgs.slice(i,i+3).join('<br>'));
  await showDialog(lines);
  $('msglog').style.display='none'; $('statwin').style.display='none';
  updateHud();
  if(isBoss){ bossDefeated=true; saveGame(); ending(); return; }
  state='field';
  $('hudhint').style.display='block';
  Snd.playSong(SONG_FIELD);
}
async function endBattle(){
  battle.active=false;
  battle.curHero=null; battle.readyQueue=[];
  closeBattleMenus();
  $('msglog').style.display='none'; $('statwin').style.display='none';
  state='field';
  $('hudhint').style.display='block';
  Snd.playSong(SONG_FIELD);
}
async function gameOver(){
  if(!battle.active) return;
  battle.active=false;
  battle.curHero=null; battle.readyQueue=[];
  closeBattleMenus();
  Snd.stopSong(); Snd.sfx('die');

  await sleep(1400);
  await showDialog(['眼前一片黑暗……<br>但水晶的微光守護了你們的靈魂。','—— 一行人在水晶鎮的旅館中醒來。（經驗與金錢保留）']);

/* ============================ 戰鬥繪圖 ============================ */
function drawBattle(dt){
  ctx.save();
  if(battle.shake.t>0){
    ctx.translate(rand(-battle.shake.mag,battle.shake.mag), rand(-battle.shake.mag,battle.shake.mag));
  }
  drawBattleBG();
  // 敵人
  for(const e of battle.enemies){
    if(!e.alive) continue;
    const blink = e.flash>0 && Math.floor(e.flash*20)%2===0;
    if(!blink) drawMonster(e);
    // Boss 蓄力紅光
    if(e.boss && battle.bossCharging){
      const g=ctx.createRadialGradient(e.sx+90,e.sy+80,10,e.sx+90,e.sy+80,140);
      g.addColorStop(0,'rgba(255,40,80,0.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(e.sx-60,e.sy-60,300,280);
    }
  }
  // 我方
  party.forEach((h,i)=>{
    const p = heroScreenPos(i);
    drawHero(h, p.x, p.y);
  });
  // 粒子（發光加成混色）
  ctx.save();
  for(const p of battle.particles){
    const a = clamp(p.life/p.maxlife,0,1);
    ctx.globalAlpha = a;
    if(p.glow){
      ctx.globalCompositeOperation='lighter';
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*1.8);
      gr.addColorStop(0,p.color); gr.addColorStop(0.4,p.color); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*1.8,0,7); ctx.fill();
    } else {
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle=p.color;
      if(p.spark){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot||0);
        ctx.fillRect(-p.size*0.18,-p.size,p.size*0.36,p.size*2); ctx.restore(); }
      else ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
  }
  ctx.restore();
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  // 繪製特效（環/雷/冰晶/光柱/斬擊）
  drawFx();
  // 召喚演出
  if(battle.cine) drawCine(battle.cine);
  // 白閃
  if(battle.flashWhite>0){
    ctx.fillStyle=`rgba(255,255,255,${clamp(battle.flashWhite,0,0.9)})`;
    ctx.fillRect(-20,-20,W+40,H+40);
  }
  // 開場立繪演出
  if(battle.introT>0) drawBattleIntro(battle.introT);
  ctx.restore();
}
/* --- 戰鬥開場：三位主角立繪登場 --- */
function drawBattleIntro(t){
  // t 由 2.2 遞減到 0
  const life = 2.2 - t;              // 已經過的時間
  const appear = clamp(life/0.5, 0, 1);   // 前0.5s 滑入
  const fade = clamp((t-0.0)/0.5, 0, 1);  // 最後0.5s 淡出
  const alpha = Math.min(appear, fade);
  // 暗幕
  ctx.fillStyle = `rgba(4,6,20,${0.55*alpha})`;
  ctx.fillRect(-20,-20,W+40,H+40);
  const cardW = 250, cardH = 380, gap = 24;
  const totalW = cardW*3 + gap*2;
  const startX = (W-totalW)/2, cy = 120;
  party.forEach((h,i)=>{
    const delay = i*0.14;
    const p = clamp((life-delay)/0.5, 0, 1);
    if(p<=0) return;
    const ease = 1-Math.pow(1-p,3);
    const x = startX + i*(cardW+gap);
    const y = cy + (1-ease)*80;
    ctx.save();
    ctx.globalAlpha = alpha*ease;
    // 卡框
    ctx.fillStyle = '#0a1040';
    ctx.strokeStyle = h.color; ctx.lineWidth = 3;
    roundRect(x, y, cardW, cardH, 12); ctx.fill();
    ctx.save(); roundRect(x+5, y+5, cardW-10, cardH-90, 8); ctx.clip();
    // 立繪或內建繪製
    if(hasPortrait(i)){
      const im = heroPortrait[i];
      const iw = cardW-10, ih = cardH-90;
      const s = Math.max(iw/im.naturalWidth, ih/im.naturalHeight);
      const dw = im.naturalWidth*s, dh = im.naturalHeight*s;
      ctx.drawImage(im, x+5+(iw-dw)/2, y+5, dw, dh);
    } else {
      // 內建：漸層底 + 放大的角色像素繪
      const g = ctx.createLinearGradient(0,y,0,y+cardH-90);
      g.addColorStop(0,'#1a2050'); g.addColorStop(1,'#05030f');
      ctx.fillStyle=g; ctx.fillRect(x+5,y+5,cardW-10,cardH-90);
      ctx.save();
      ctx.translate(x+cardW/2, y+cardH-120); ctx.scale(4.6,4.6);
      drawHeroBust(h);
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,0.06)';
      ctx.fillRect(x+5,y+5,cardW-10,26);
    }
    ctx.restore();
    // 名牌
    ctx.fillStyle = h.color;
    roundRect(x+5, y+cardH-80, cardW-10, 74, 8); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x+5,y+cardH-80,cardW-10,74);
    ctx.textAlign='center';
    ctx.fillStyle='#fff'; ctx.font='bold 26px "Microsoft JhengHei",serif';
    ctx.fillText(h.name, x+cardW/2, y+cardH-46);
    ctx.fillStyle='#cfe0ff'; ctx.font='15px "Microsoft JhengHei",sans-serif';
    ctx.fillText(`${h.cls}　Lv${h.lv}`, x+cardW/2, y+cardH-22);
    ctx.textAlign='left';
    ctx.restore();
  });
  // 標語
  if(alpha>0.3){
    ctx.save(); ctx.globalAlpha=alpha; ctx.textAlign='center';
    ctx.font='bold 30px "Microsoft JhengHei",serif';
    ctx.fillStyle='#000'; ctx.fillText('－ 戰 鬥 開 始 －', W/2+2, 542+2);
    const g=ctx.createLinearGradient(0,520,0,552);
    g.addColorStop(0,'#fff'); g.addColorStop(1,'#ffd680');
    ctx.fillStyle=g; ctx.fillText('－ 戰 鬥 開 始 －', W/2, 542);
    ctx.textAlign='left'; ctx.restore();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
/* 內建立繪半身像（無外部圖時使用，取 drawHero 的上半身放大版） */
function drawHeroBust(h){
  // 影子省略；沿用 drawHero 的身體/頭部畫法但置中於 (0,0)
  const c=h.color;
  if(h.idx===0){
    ctx.fillStyle='#a02838'; ctx.fillRect(-16,-8,6,32);
    ctx.fillStyle=c; ctx.fillRect(-10,-6,20,24);
    ctx.fillStyle='#88b0ff'; ctx.fillRect(-10,-6,20,7);
    ctx.fillStyle='#f0c8a0'; ctx.fillRect(-7,-20,14,13);
    ctx.fillStyle='#4868d8'; ctx.fillRect(-9,-25,18,7);
    ctx.fillStyle='#ffe082'; ctx.fillRect(-9,-27,18,3);
    ctx.fillStyle='#000'; ctx.fillRect(-4,-15,2,3); ctx.fillRect(2,-15,2,3);
    ctx.fillStyle='#e8ecff'; ctx.fillRect(12,-30,4,34);
    ctx.fillStyle='#ffe082'; ctx.fillRect(8,2,12,4);
  } else if(h.idx===1){
    ctx.fillStyle='#302048'; ctx.fillRect(-11,-4,22,24);
    ctx.fillStyle=c; ctx.fillRect(-11,-4,22,6);
    ctx.fillStyle='#f0c8a0'; ctx.fillRect(-6,-17,12,12);
    ctx.fillStyle='#000'; ctx.fillRect(-3,-12,2,3); ctx.fillRect(2,-12,2,3);
    ctx.fillStyle='#403060';
    ctx.beginPath(); ctx.moveTo(-13,-16); ctx.lineTo(2,-38); ctx.lineTo(13,-16); ctx.closePath(); ctx.fill();

      ctx.restore();

  else if(c.type==='ramuh'){
    // 雷雲
    for(let i=0;i<5;i++){

function cineCaption(txt, tt){
  const a = clamp(tt*1.5,0,1);
  ctx.save(); ctx.globalAlpha=a;
  ctx.font='bold 34px "Microsoft JhengHei",serif'; ctx.textAlign='center';
  ctx.fillStyle='#000'; ctx.fillText(txt, W/2+2, 522+2);
  const g=ctx.createLinearGradient(0,500,0,530);
  g.addColorStop(0,'#fff'); g.addColorStop(1,'#ffd080');
  ctx.fillStyle=g; ctx.fillText(txt, W/2, 522);
  ctx.restore(); ctx.textAlign='left';
}

/* ============================ 主迴圈 ============================ */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  ctx.clearRect(0,0,W,H);
  if(state==='title'||state==='titlemenu') drawTitle(dt);
  else if(state==='battle'||state==='gameover'){ updateBattle(dt); drawBattle(dt); }
  else if(state==='ending'){ drawTitle(dt); }
  else { // field / town / shop / menu / intro / dialog
    if(state==='field') updateField(dt);
    drawField(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
